<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#1A1815;color:#EDE9E0;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  ::selection{background:#D8A24A;color:#1A1815}
  input,textarea,button,select{font-family:inherit;color:inherit}
  input:focus,textarea:focus{outline:none}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3a342a;border-radius:8px;border:2px solid #1A1815}
  ::-webkit-scrollbar-thumb:hover{background:#4a4332}
  @keyframes bm-pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes bm-fade{from{opacity:0}to{opacity:1}}
  [data-card]{transition:transform .16s cubic-bezier(.2,.7,.3,1),border-color .16s,background .16s,box-shadow .16s}
  [data-card]:hover{transform:translateY(-3px);border-color:rgba(216,162,74,.55)!important;box-shadow:0 12px 28px -12px rgba(0,0,0,.65)}
  [data-card]:active{transform:translateY(-1px) scale(.995)}
  [data-add]:hover{border-color:rgba(216,162,74,.6)!important;color:#D8A24A!important;background:rgba(216,162,74,.05)!important}
  [data-btn]{transition:background .14s,color .14s,border-color .14s,transform .1s}
  [data-btn]:hover{background:rgba(255,255,255,.08)}
  [data-btn]:active{transform:scale(.93)}
  [data-pri]:hover{background:#e6b15c!important}
  [data-ghost]:hover{background:rgba(255,255,255,.06)}
  [data-pick]:hover{border-color:rgba(216,162,74,.55)!important;background:rgba(216,162,74,.06)!important;transform:translateY(-2px)}
  [data-handle]{cursor:grab}
  [data-handle]:active{cursor:grabbing}
  [data-drop-on]{outline:2px dashed rgba(216,162,74,.7);outline-offset:3px}
  input[data-inp],textarea[data-inp]{transition:border-color .14s,background .14s}
  input[data-inp]:focus,textarea[data-inp]:focus{border-color:rgba(216,162,74,.7)!important;background:rgba(255,255,255,.05)!important}
  [data-secname]:hover{background:rgba(255,255,255,.05)}
  #boot-msg{font-family:'Hanken Grotesk',system-ui,sans-serif;color:#9a9484;text-align:center;padding:90px 20px}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"><div id="boot-msg">Loading bookmarks…<br><br><span style="font-size:13px">If this message stays, you appear to be offline — this page needs an internet connection on first load to fetch its UI engine.</span></div></div>

<script>
const KEY = 'bm.sections.v3';
const C = {
  bg:'#1A1815', surface:'rgba(255,255,255,.035)', surfaceSolid:'#242019',
  border:'rgba(255,255,255,.09)', text:'#EDE9E0', muted:'#9a9484', faint:'#6f6a5d',
  accent:'#D8A24A'
};
const CHIP = ['#C26B40','#4079C2','#3F9E72','#9466C2','#C2A340','#C2466A','#3FA9A9'];
const h = React.createElement;

function uid(){ return Math.random().toString(36).slice(2,9); }
function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function faviconOf(u){ const d=domainOf(u); return d?('https://icons.duckduckgo.com/ip3/'+d+'.ico'):''; }
function hashNum(s){ let n=0; s=s||''; for(let i=0;i<s.length;i++) n=(n*31 + s.charCodeAt(i))>>>0; return n; }
function chipColor(s){ return CHIP[hashNum(s)%CHIP.length]; }
function extOf(name){ const m=(name||'').split('.'); return m.length>1 ? m.pop().toUpperCase().slice(0,4) : 'FILE'; }
function fmtSize(b){ if(!b&&b!==0) return ''; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function seed(){
  return [
    { id:uid(), title:'Daily', items:[
      { id:uid(), type:'link', title:'Gmail', url:'https://mail.google.com' },
      { id:uid(), type:'link', title:'Calendar', url:'https://calendar.google.com' },
      { id:uid(), type:'link', title:'GitHub', url:'https://github.com' },
      { id:uid(), type:'note', title:'Standup', text:'Daily standup 9:30am.\nShare blockers in #team channel.' },
    ]},
    { id:uid(), title:'Watchlist', items:[
      { id:uid(), type:'poster', title:'Dune: Part Two', image:'', url:'' },
      { id:uid(), type:'poster', title:'Severance', image:'', url:'' },
      { id:uid(), type:'poster', title:'The Bear', image:'', url:'' },
      { id:uid(), type:'link', title:'Letterboxd', url:'https://letterboxd.com' },
    ]},
    { id:uid(), title:'Work', items:[
      { id:uid(), type:'file', title:'Q3 Report', fileName:'Q3-report.pdf', size:284000, mime:'application/pdf', dataUrl:'' },
      { id:uid(), type:'file', title:'Brand Designs', fileName:'designs.fig', size:1840000, mime:'', dataUrl:'' },
      { id:uid(), type:'folder', name:'References', items:[
        { id:uid(), type:'link', title:'Dribbble', url:'https://dribbble.com' },
        { id:uid(), type:'link', title:'Figma', url:'https://figma.com' },
      ]},
    ]},
  ];
}

// First-run data: existing v3 → migrate old browser-home (hp_home) → seed demo
function loadInitial(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(Array.isArray(d)&&d.length) return d; } }catch(e){}
  try{
    const oldRaw = localStorage.getItem('hp_home');
    if(oldRaw){
      const old = JSON.parse(oldRaw);
      if(old && Array.isArray(old.sections) && old.sections.length){
        const conv = old.sections.map(s=>({
          id: uid(),
          title: s.name || 'Section',
          items: (s.bookmarks||[]).map(b=>{
            if(b.type==='movie') return {id:uid(),type:'poster',title:b.name||'',image:(b.img&&!String(b.img).includes('s2/favicons'))?b.img:'',url:b.url||''};
            return {id:uid(),type:'link',title:b.name||'',url:b.url||''};
          })
        }));
        if(conv.length) return conv;
      }
    }
  }catch(e){}
  return seed();
}

class App extends React.Component {
  constructor(p){
    super(p);
    this.state = { sections: loadInitial(), edit:false, query:'', modal:null, hover:null, dragOverSec:null, renaming:null };
    this._drag = null;
  }
  componentDidMount(){
    this._kd = (e)=>{ if((e.key==='Control'||e.key==='Meta') && !this.state.edit) this.setState({edit:true}); };
    this._ku = (e)=>{ if(e.key==='Control'||e.key==='Meta') this.setState({edit:false}); };
    this._blur = ()=>{ if(this.state.edit) this.setState({edit:false}); };
    document.addEventListener('keydown', this._kd);
    document.addEventListener('keyup', this._ku);
    window.addEventListener('blur', this._blur);
  }
  componentWillUnmount(){
    document.removeEventListener('keydown', this._kd);
    document.removeEventListener('keyup', this._ku);
    window.removeEventListener('blur', this._blur);
  }
  save(){
    try{ localStorage.setItem(KEY, JSON.stringify(this.state.sections)); }
    catch(e){ if(!this._warned){ this._warned=true; alert('Browser storage is full — very large files may not be saved, but links, notes and smaller files will persist.'); } }
  }
  update(mutator){
    const next = (typeof structuredClone==='function') ? structuredClone(this.state.sections) : JSON.parse(JSON.stringify(this.state.sections));
    mutator(next);
    this.setState({sections: next}, ()=>this.save());
  }
  containerOf(secs, loc){
    const s = secs.find(x=>x.id===loc.sectionId); if(!s) return null;
    if(loc.folderId){ const f=s.items.find(i=>i.id===loc.folderId); return f?f.items:null; }
    return s.items;
  }
  sameLoc(a,b){ return a.sectionId===b.sectionId && (a.folderId||null)===(b.folderId||null); }

  // ---- sections ----
  addSection(){ const id=uid(); this.update(n=>{ n.unshift({id, title:'New Section', items:[]}); }); setTimeout(()=>this.setState({renaming:id}), 30); }
  renameSection(id, title){ this.update(n=>{ const s=n.find(x=>x.id===id); if(s) s.title=title; }); }
  deleteSection(id){ if(!confirm('Delete this whole section?')) return; this.update(n=>{ const i=n.findIndex(x=>x.id===id); if(i>=0) n.splice(i,1); }); }
  moveSectionTo(from,to){ this.update(n=>{ const [s]=n.splice(from,1); let i=to; if(from<to) i--; n.splice(i,0,s); }); }

  // ---- items ----
  addItem(loc, item){ this.update(n=>{ const c=this.containerOf(n,loc); if(c) c.push(item); }); }
  saveItem(loc, item){ this.update(n=>{ const c=this.containerOf(n,loc); if(!c) return; const i=c.findIndex(x=>x.id===item.id); if(i>=0) c[i]=item; else c.push(item); }); }
  deleteItem(loc, id){ this.update(n=>{ const c=this.containerOf(n,loc); if(!c) return; const i=c.findIndex(x=>x.id===id); if(i>=0) c.splice(i,1); }); }
  moveItem(fromLoc, fromIdx, toLoc, toIdx){
    this.update(n=>{
      const from=this.containerOf(n,fromLoc); if(!from) return;
      const [it]=from.splice(fromIdx,1);
      const to=this.containerOf(n,toLoc); if(!to){ from.splice(fromIdx,0,it); return; }
      let i = (toIdx==null) ? to.length : toIdx;
      if(this.sameLoc(fromLoc,toLoc) && fromIdx<i) i--;
      to.splice(i,0,it);
    });
  }
  moveItemIntoFolder(fromLoc, fromIdx, sectionId, folderId){
    this.update(n=>{
      const from=this.containerOf(n,fromLoc); if(!from) return;
      const it = from[fromIdx]; if(!it || it.id===folderId || it.type==='folder') return;
      from.splice(fromIdx,1);
      const sec=n.find(s=>s.id===sectionId); const f=sec&&sec.items.find(x=>x.id===folderId);
      if(f) f.items.push(it); else from.splice(fromIdx,0,it);
    });
  }

  openItem(item, loc){
    if(item.type==='link' || item.type==='poster'){ if(item.url) window.open(item.url,'_blank','noopener'); else if(item.type==='poster') this.setState({modal:{type:'form',kind:'poster',loc,draft:{...item}}}); }
    else if(item.type==='file'){ if(item.dataUrl) window.open(item.dataUrl,'_blank'); else alert('This is a sample file. Add your own via edit mode to open it.'); }
    else if(item.type==='note'){ this.setState({modal:{type:'note-view', item}}); }
    else if(item.type==='folder'){ this.setState({modal:{type:'folder-view', sectionId:loc.sectionId, folderId:item.id}}); }
  }

  // =================== RENDER ===================
  render(){
    const total = this.state.sections.reduce((a,s)=>a+s.items.length,0);
    const countLabel = this.state.sections.length+' sections · '+total+' bookmarks';
    return h('div',{style:{minHeight:'100vh',background:'radial-gradient(1200px 600px at 80% -10%, rgba(216,162,74,.06), transparent 60%), #1A1815'}},
      h('header',{style:{position:'sticky',top:0,zIndex:40,backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',background:'rgba(26,24,21,.82)',borderBottom:'1px solid rgba(255,255,255,.07)'}},
        h('div',{style:{maxWidth:'1320px',margin:'0 auto',padding:'18px 28px',display:'flex',alignItems:'center',gap:'20px',flexWrap:'wrap'}},
          h('div',{style:{display:'flex',alignItems:'center',gap:'12px',flex:'none'}},
            h('div',{style:{width:'34px',height:'34px',borderRadius:'9px',background:'linear-gradient(140deg,#D8A24A,#b9803a)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Space Grotesk'",fontWeight:700,color:'#1A1815',fontSize:'18px'}},'B'),
            h('div',{},
              h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'19px',letterSpacing:'-.01em',lineHeight:1}},'Bookmarks'),
              h('div',{style:{fontSize:'11.5px',color:'#8a8475',marginTop:'3px'}}, countLabel))),
          h('div',{style:{flex:1,minWidth:'200px',display:'flex',justifyContent:'center'}},
            h('div',{style:{position:'relative',width:'100%',maxWidth:'440px'}},
              h('span',{style:{position:'absolute',left:'14px',top:'50%',transform:'translateY(-50%)',color:'#8a8475',fontSize:'14px'}},'⌕'),
              h('input',{'data-inp':true,type:'text',placeholder:'Search bookmarks…',onChange:(e)=>this.setState({query:e.target.value}),
                style:{width:'100%',background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.09)',borderRadius:'11px',padding:'10px 14px 10px 36px',fontSize:'14px',color:'#EDE9E0'}}))),
          h('div',{style:{flex:'none',display:'flex',alignItems:'center',gap:'12px'}},
            h('div',{style:{fontSize:'12px',color:'#8a8475',display:'flex',alignItems:'center',gap:'7px'}},'Hold ',
              h('kbd',{style:{fontFamily:"'Space Grotesk'",fontSize:'11px',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',borderBottomWidth:'2px',borderRadius:'6px',padding:'2px 7px',color:'#cfc8b8'}},'Ctrl'),' to edit'),
            h('button',{'data-pri':true,onClick:()=>this.addSection(),style:{background:'#D8A24A',color:'#1A1815',border:'none',borderRadius:'10px',padding:'10px 16px',fontWeight:600,fontSize:'13.5px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px'}},'+ New section'))
        )),
      h('main',{style:{maxWidth:'1320px',margin:'0 auto',padding:'34px 28px 120px'}}, this.renderBoard()),
      this.state.edit ? this.renderBanner() : null,
      this.renderModal()
    );
  }

  renderBanner(){
    return h('div',{key:'bn',style:{position:'fixed',bottom:'22px',left:'50%',transform:'translateX(-50%)',zIndex:60,background:'#2b2620',border:'1px solid '+C.border,borderRadius:'12px',padding:'10px 18px',display:'flex',alignItems:'center',gap:'12px',boxShadow:'0 14px 40px -12px rgba(0,0,0,.7)',animation:'bm-pop .2s ease both',fontSize:'13px'}},
      h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:C.accent,boxShadow:'0 0 10px '+C.accent}}),
      h('span',{style:{color:C.text,fontWeight:600}},'Edit mode'),
      h('span',{style:{color:C.muted}},'Drag to reorder · click a card to edit · ✕ to delete')
    );
  }

  matches(item, q){
    if(!q) return true;
    const hay = [item.title,item.name,item.text,item.fileName,domainOf(item.url)].filter(Boolean).join(' ').toLowerCase();
    if(hay.includes(q)) return true;
    if(item.type==='folder' && item.items) return item.items.some(c=>this.matches(c,q));
    return false;
  }

  renderBoard(){
    const q = this.state.query.trim().toLowerCase();
    const secs = this.state.sections;
    if(secs.length===0) return this.emptyState();
    const visible = secs.map((s,i)=>({s,i})).filter(({s})=> !q || s.title.toLowerCase().includes(q) || s.items.some(it=>this.matches(it,q)) );
    if(q && visible.length===0) return h('div',{style:{textAlign:'center',padding:'80px 0',color:C.muted}}, 'No bookmarks match “'+this.state.query+'”.');
    return h('div',{style:{display:'flex',flexDirection:'column',gap:'42px'}},
      visible.map(({s,i})=> this.renderSection(s,i,q)) );
  }

  emptyState(){
    return h('div',{style:{textAlign:'center',padding:'90px 20px',animation:'bm-fade .3s ease'}},
      h('div',{style:{fontSize:'40px',marginBottom:'8px',opacity:.6}},'🔖'),
      h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'22px',marginBottom:'8px'}},'No sections yet'),
      h('div',{style:{color:C.muted,marginBottom:'22px'}},'Create a section to start grouping your links, shows, files and notes.'),
      h('button',{'data-pri':true,onClick:()=>this.addSection(),style:{background:C.accent,color:C.bg,border:'none',borderRadius:'10px',padding:'12px 22px',fontWeight:600,fontSize:'14px',cursor:'pointer'}},'+ Create your first section')
    );
  }

  renderSection(section, sIdx, q){
    const edit = this.state.edit;
    const renaming = this.state.renaming===section.id;
    const items = section.items.filter(it=> !section.title.toLowerCase().includes(q) ? this.matches(it,q) : true);
    const dragHi = this.state.dragOverSec===section.id;

    const header = h('div',{
        style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px',paddingTop:'6px',borderTop: dragHi?'2px solid '+C.accent:'2px solid transparent',transition:'border-color .15s'},
        onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='section'){ e.preventDefault(); if(this.state.dragOverSec!==section.id) this.setState({dragOverSec:section.id}); } }:null,
        onDragLeave: edit?()=>{ if(this.state.dragOverSec===section.id) this.setState({dragOverSec:null}); }:null,
        onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='section'){ e.preventDefault(); this.moveSectionTo(this._drag.index, sIdx); this._drag=null; this.setState({dragOverSec:null}); } }:null,
      },
      edit ? h('span',{'data-handle':true,draggable:true,
        onDragStart:(e)=>{ this._drag={kind:'section',index:sIdx}; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain','s');}catch(_){} },
        onDragEnd:()=>{ this._drag=null; this.setState({dragOverSec:null}); },
        title:'Drag to reorder section',
        style:{color:C.faint,fontSize:'18px',lineHeight:1,letterSpacing:'-2px',userSelect:'none'}},'⠿⠿') : null,
      renaming
        ? h('input',{autoFocus:true,defaultValue:section.title,'data-inp':true,
            onBlur:(e)=>{ this.renameSection(section.id, e.target.value.trim()||'Untitled'); this.setState({renaming:null}); },
            onKeyDown:(e)=>{ if(e.key==='Enter') e.target.blur(); },
            style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'21px',background:'rgba(255,255,255,.05)',border:'1px solid '+C.border,borderRadius:'8px',padding:'4px 10px'}})
        : h('h2',{'data-secname':edit?true:null,onClick: edit?()=>this.setState({renaming:section.id}):null,
            style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'21px',margin:0,letterSpacing:'-.015em',cursor:edit?'text':'default',padding:'4px 8px',marginLeft:'-8px',borderRadius:'8px'}}, section.title),
      h('span',{style:{fontSize:'12.5px',color:C.faint,background:'rgba(255,255,255,.04)',borderRadius:'20px',padding:'3px 10px'}}, section.items.length),
      h('div',{style:{flex:1}}),
      edit ? h('div',{style:{display:'flex',gap:'4px'}},
        this.iconBtn('▲','Move up', sIdx===0?null:()=>this.moveSectionTo(sIdx,sIdx-1)),
        this.iconBtn('▼','Move down', sIdx===this.state.sections.length-1?null:()=>this.moveSectionTo(sIdx,sIdx+1)),
        this.iconBtn('✎','Rename', ()=>this.setState({renaming:section.id})),
        this.iconBtn('✕','Delete section', ()=>this.deleteSection(section.id), true),
      ) : null
    );

    const loc = {sectionId:section.id};
    const grid = h('div',{
        style:{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(174px, 1fr))',gridAutoRows:'120px',gridAutoFlow:'row dense',gap:'18px'},
        onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='item') e.preventDefault(); }:null,
        onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='item'){ e.preventDefault(); this.moveItem(this._drag.loc,this._drag.index, loc, null); this._drag=null; } }:null,
      },
      items.map((it)=> this.renderCard(it, loc, section.items.indexOf(it))),
      this.addTile(loc)
    );

    return h('section',{key:section.id, style:{animation:'bm-fade .25s ease'}}, header, grid);
  }

  iconBtn(glyph,title,onClick,danger){
    return h('button',{'data-btn':true,disabled:!onClick,title,onClick:onClick||undefined,
      style:{width:'30px',height:'30px',borderRadius:'8px',border:'1px solid '+C.border,background:'transparent',color:onClick?(danger?'#d98a8a':C.muted):C.faint,cursor:onClick?'pointer':'default',fontSize:'13px',display:'flex',alignItems:'center',justifyContent:'center',opacity:onClick?1:.4}}, glyph);
  }

  addTile(loc){
    return h('button',{key:'add','data-add':true,onClick:()=>this.setState({modal:{type:'pick',loc}}),
      style:{gridRow:'span 1',borderRadius:'14px',border:'1.5px dashed rgba(255,255,255,.16)',background:'transparent',color:C.faint,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'4px',transition:'all .15s',minHeight:'120px'}},
      h('span',{style:{fontSize:'22px',lineHeight:1}},'+'),
      h('span',{style:{fontSize:'12px',fontWeight:500}},'Add')
    );
  }

  cardShell(item, loc, idx, inner, opts){
    opts = opts||{};
    const edit = this.state.edit;
    return h('div',{key:item.id,'data-card':true,
      draggable: edit,
      onDragStart: edit?(e)=>{ this._drag={kind:'item',loc,index:idx}; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain','i');}catch(_){} }:null,
      onDragEnd: edit?()=>{ this._drag=null; }:null,
      onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='item') e.preventDefault(); }:null,
      onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='item'){ e.preventDefault(); e.stopPropagation(); if(opts.onDrop){ opts.onDrop(this._drag); } else { this.moveItem(this._drag.loc,this._drag.index, loc, idx); } this._drag=null; } }:null,
      onClick:(e)=>{ if(e.target.closest('[data-del]')) return; if(edit) this.openForm(item, loc); else this.openItem(item, loc); },
      style:Object.assign({position:'relative',borderRadius:'14px',border:'1px solid '+C.border,background:opts.bg||C.surface,cursor:'pointer',overflow:'hidden',gridRow:opts.tall?'span 2':'span 1',display:'flex',flexDirection:'column'}, opts.style||{})
    },
      inner,
      edit ? h('button',{'data-del':true,'data-btn':true,title:'Delete',onClick:(e)=>{ e.stopPropagation(); this.deleteItem(loc,item.id); },
        style:{position:'absolute',top:'7px',right:'7px',width:'24px',height:'24px',borderRadius:'7px',border:'none',background:'rgba(20,18,15,.78)',color:'#e6a0a0',cursor:'pointer',fontSize:'12px',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)',zIndex:3}},'✕') : null
    );
  }

  renderCard(item, loc, idx){
    if(item.type==='poster') return this.posterCard(item, loc, idx);
    if(item.type==='link') return this.linkCard(item, loc, idx);
    if(item.type==='file') return this.fileCard(item, loc, idx);
    if(item.type==='note') return this.noteCard(item, loc, idx);
    if(item.type==='folder') return this.folderCard(item, loc, idx);
    return null;
  }

  linkCard(item, loc, idx){
    const dom = domainOf(item.url);
    const fav = faviconOf(item.url);
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'10px'}},
      h('div',{style:{width:'38px',height:'38px',borderRadius:'10px',background:'rgba(255,255,255,.06)',display:'flex',alignItems:'center',justifyContent:'center',flex:'none',overflow:'hidden'}},
        fav ? h('img',{src:fav,width:22,height:22,style:{borderRadius:'4px'},onError:(e)=>{ e.target.style.display='none'; e.target.parentNode.textContent=(item.title||'?')[0].toUpperCase(); e.target.parentNode.style.fontWeight='700'; e.target.parentNode.style.color=C.accent; }})
           : h('span',{style:{fontWeight:700,color:C.accent}}, (item.title||'?')[0].toUpperCase())),
      h('div',{style:{marginTop:'auto'}},
        h('div',{style:{fontWeight:600,fontSize:'14px',lineHeight:1.25,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}, item.title||dom||'Untitled'),
        h('div',{style:{fontSize:'11.5px',color:C.faint,marginTop:'3px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, dom||'—'))
    );
    return this.cardShell(item, loc, idx, inner);
  }

  posterCard(item, loc, idx){
    const hue = hashNum(item.title)%360;
    const inner = h('div',{style:{position:'relative',width:'100%',height:'100%'}},
      item.image
        ? h('img',{src:item.image,alt:item.title,style:{width:'100%',height:'100%',objectFit:'cover',display:'block'},onError:(e)=>{ e.target.style.display='none'; }})
        : h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(150deg, hsl('+hue+' 42% 30%), hsl('+((hue+40)%360)+' 38% 18%))',display:'flex',alignItems:'center',justifyContent:'center'}},
            h('span',{style:{fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:'30px',color:'rgba(255,255,255,.22)'}}, (item.title||'?').slice(0,2).toUpperCase())),
      h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(10,9,7,.92) 8%, rgba(10,9,7,.2) 45%, transparent 70%)'}}),
      h('div',{style:{position:'absolute',left:0,right:0,bottom:0,padding:'12px'}},
        h('div',{style:{fontWeight:600,fontSize:'13.5px',lineHeight:1.25,textShadow:'0 1px 6px rgba(0,0,0,.6)',overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}, item.title),
        item.url ? h('div',{style:{fontSize:'10.5px',color:'rgba(255,255,255,.6)',marginTop:'3px'}}, '↗ '+domainOf(item.url)) : null)
    );
    return this.cardShell(item, loc, idx, inner, {tall:true, bg:'#111'});
  }

  fileCard(item, loc, idx){
    const ext = extOf(item.fileName);
    const col = chipColor(ext);
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'10px'}},
      h('div',{style:{width:'40px',height:'46px',borderRadius:'7px',background:col,position:'relative',flex:'none',boxShadow:'0 4px 10px -4px '+col,display:'flex',alignItems:'flex-end',padding:'5px'}},
        h('span',{style:{position:'absolute',top:0,right:0,width:'13px',height:'13px',background:'rgba(255,255,255,.32)',borderBottomLeftRadius:'5px'}}),
        h('span',{style:{fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:'9.5px',color:'rgba(255,255,255,.95)',letterSpacing:'.02em'}}, ext)),
      h('div',{style:{marginTop:'auto'}},
        h('div',{style:{fontWeight:600,fontSize:'13.5px',lineHeight:1.25,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}, item.title||item.fileName),
        h('div',{style:{fontSize:'11px',color:C.faint,marginTop:'3px'}}, [fmtSize(item.size), item.dataUrl?'':'sample'].filter(Boolean).join(' · ')))
    );
    return this.cardShell(item, loc, idx, inner);
  }

  noteCard(item, loc, idx){
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'7px'}},
      h('div',{style:{fontWeight:600,fontSize:'13.5px',display:'flex',alignItems:'center',gap:'6px'}},
        h('span',{style:{color:C.accent,fontSize:'12px'}},'❝'), item.title||'Note'),
      h('div',{style:{fontSize:'12px',color:C.muted,lineHeight:1.5,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',whiteSpace:'pre-wrap'}}, item.text||'')
    );
    return this.cardShell(item, loc, idx, inner, {bg:'rgba(216,162,74,.07)', style:{border:'1px solid rgba(216,162,74,.22)'}});
  }

  folderCard(item, loc, idx){
    const edit = this.state.edit;
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'10px'}},
      h('div',{style:{width:'42px',height:'34px',position:'relative',flex:'none'}},
        h('div',{style:{position:'absolute',inset:'4px 0 0 0',background:'rgba(255,255,255,.08)',borderRadius:'6px'}}),
        h('div',{style:{position:'absolute',inset:'0 6px 4px 6px',top:'6px',background:'rgba(216,162,74,.85)',borderRadius:'6px'}}),
        h('div',{style:{position:'absolute',left:0,top:0,width:'18px',height:'9px',background:'rgba(216,162,74,.85)',borderRadius:'5px 5px 0 0'}})),
      h('div',{style:{marginTop:'auto'}},
        h('div',{style:{fontWeight:600,fontSize:'13.5px',lineHeight:1.25}}, item.name||'Folder'),
        h('div',{style:{fontSize:'11px',color:C.faint,marginTop:'3px'}}, (item.items?item.items.length:0)+' items'))
    );
    return this.cardShell(item, loc, idx, inner, {bg:'rgba(255,255,255,.05)',
      onDrop: (drag)=>{ if(!this.sameLoc(drag.loc,loc) || drag.index!==idx) this.moveItemIntoFolder(drag.loc, drag.index, loc.sectionId, item.id); }
    });
  }

  openForm(item, loc){
    if(item.type==='note') this.setState({modal:{type:'form',kind:'note',loc,draft:{...item}}});
    else if(item.type==='folder') this.setState({modal:{type:'form',kind:'folder',loc,draft:{...item}}});
    else this.setState({modal:{type:'form',kind:item.type,loc,draft:{...item}}});
  }

  // =================== MODALS ===================
  closeModal(){ this.setState({modal:null}); }
  renderModal(){
    const m = this.state.modal; if(!m) return null;
    let body;
    if(m.type==='pick') body=this.pickBody(m);
    else if(m.type==='form') body=this.formBody(m);
    else if(m.type==='note-view') body=this.noteViewBody(m);
    else if(m.type==='folder-view') body=this.folderViewBody(m);
    const wide = m.type==='folder-view';
    return h('div',{key:'overlay',onClick:(e)=>{ if(e.target===e.currentTarget) this.closeModal(); },
      style:{position:'fixed',inset:0,zIndex:80,background:'rgba(10,9,7,.6)',backdropFilter:'blur(6px)',WebkitBackdropFilter:'blur(6px)',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'8vh 20px 40px',overflowY:'auto',animation:'bm-fade .15s ease'}},
      h('div',{style:{width:'100%',maxWidth: wide?'920px':'460px',background:'#23201a',border:'1px solid '+C.border,borderRadius:'18px',boxShadow:'0 30px 80px -20px rgba(0,0,0,.8)',animation:'bm-pop .2s cubic-bezier(.2,.7,.3,1) both',overflow:'hidden'}}, body)
    );
  }

  pickBody(m){
    const opts=[
      ['link','Link','Website or web app','#4079C2'],
      ['poster','Show / Movie','2:3 poster card','#C2466A'],
      ['file','File','From your device','#3F9E72'],
      ['note','Note','Plain text reminder','#C2A340'],
      ['folder','Folder','Group items together','#9466C2'],
    ];
    return h('div',{style:{padding:'22px'}},
      this.modalHead('Add bookmark'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginTop:'4px'}},
        opts.map(([k,label,desc,col])=> h('button',{key:k,'data-pick':true,onClick:()=>this.setState({modal:{type:'form',kind:k,loc:m.loc,draft:this.blankDraft(k)}}),
          style:{textAlign:'left',background:'rgba(255,255,255,.03)',border:'1px solid '+C.border,borderRadius:'12px',padding:'14px',cursor:'pointer',display:'flex',gap:'12px',alignItems:'center',transition:'all .15s'}},
          h('span',{style:{width:'30px',height:'30px',borderRadius:'8px',background:col,flex:'none'}}),
          h('span',{},
            h('div',{style:{fontWeight:600,fontSize:'14px'}},label),
            h('div',{style:{fontSize:'11.5px',color:C.muted,marginTop:'2px'}},desc)))
        ))
    );
  }
  blankDraft(k){
    const id=uid();
    if(k==='link') return {id,type:'link',title:'',url:''};
    if(k==='poster') return {id,type:'poster',title:'',image:'',url:''};
    if(k==='file') return {id,type:'file',title:'',fileName:'',size:0,mime:'',dataUrl:''};
    if(k==='note') return {id,type:'note',title:'',text:''};
    if(k==='folder') return {id,type:'folder',name:'',items:[]};
  }

  field(label, node){
    return h('label',{style:{display:'block',marginBottom:'14px'}},
      h('div',{style:{fontSize:'12px',fontWeight:600,color:C.muted,marginBottom:'6px'}},label), node);
  }
  inp(val, onChange, ph, type){
    return h('input',{'data-inp':true,type:type||'text',value:val||'',placeholder:ph||'',onChange:(e)=>onChange(e.target.value),
      style:{width:'100%',background:'rgba(255,255,255,.03)',border:'1px solid '+C.border,borderRadius:'10px',padding:'10px 12px',fontSize:'14px'}});
  }

  formBody(m){
    const d = m.draft; const k = m.kind;
    const set = (patch)=> this.setState({modal:{...m, draft:{...m.draft,...patch}}});
    const isEdit = !!this.containerOf(this.state.sections, m.loc)?.find(x=>x.id===d.id);
    const titles = {link:'Link', poster:'Show / Movie', file:'File', note:'Note', folder:'Folder'};
    let fields=[];
    if(k==='link'){
      fields=[ this.field('Title', this.inp(d.title,(v)=>set({title:v}),'e.g. GitHub')),
        this.field('URL', this.inp(d.url,(v)=>set({url:v}),'https://…')) ];
    } else if(k==='poster'){
      fields=[ this.field('Title', this.inp(d.title,(v)=>set({title:v}),'e.g. Severance')),
        this.field('Poster image URL', this.inp(d.image,(v)=>set({image:v}),'https://…  (optional)')),
        this.field('Link URL', this.inp(d.url,(v)=>set({url:v}),'where it plays (optional)')),
        d.image ? h('div',{style:{marginBottom:'14px'}}, h('img',{src:d.image,style:{width:'90px',aspectRatio:'2/3',objectFit:'cover',borderRadius:'8px',border:'1px solid '+C.border},onError:(e)=>{e.target.style.opacity='.3';}})) : null ];
    } else if(k==='file'){
      fields=[
        h('div',{style:{marginBottom:'14px'}},
          h('div',{style:{fontSize:'12px',fontWeight:600,color:C.muted,marginBottom:'6px'}},'File'),
          h('label',{'data-add':true,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',border:'1.5px dashed rgba(255,255,255,.18)',borderRadius:'12px',padding:'22px',cursor:'pointer',transition:'all .15s'}},
            h('span',{style:{fontSize:'22px'}},'⬆'),
            h('span',{style:{fontSize:'13px',color:C.muted}}, d.fileName? (d.fileName+'  ·  '+fmtSize(d.size)) : 'Choose a file from your device'),
            h('input',{type:'file',style:{display:'none'},onChange:(e)=>this.onFile(e,m)}))),
        this.field('Display name', this.inp(d.title,(v)=>set({title:v}),'optional — defaults to file name')),
      ];
    } else if(k==='note'){
      fields=[ this.field('Title', this.inp(d.title,(v)=>set({title:v}),'optional')),
        this.field('Text', h('textarea',{'data-inp':true,value:d.text||'',onChange:(e)=>set({text:e.target.value}),placeholder:'Write anything…',
          style:{width:'100%',minHeight:'120px',resize:'vertical',background:'rgba(255,255,255,.03)',border:'1px solid '+C.border,borderRadius:'10px',padding:'10px 12px',fontSize:'14px',lineHeight:1.5}})) ];
    } else if(k==='folder'){
      fields=[ this.field('Folder name', this.inp(d.name,(v)=>set({name:v}),'e.g. Articles')) ];
    }
    const canSave = (k==='folder' ? (d.name||'').trim() : k==='note' ? ((d.text||'').trim()||(d.title||'').trim()) : k==='file' ? (d.fileName||d.title) : (d.title||'').trim()||(d.url||'').trim());
    return h('div',{style:{padding:'22px'}},
      this.modalHead((isEdit?'Edit ':'Add ')+titles[k]),
      h('div',{}, fields),
      h('div',{style:{display:'flex',gap:'10px',justifyContent:'flex-end',marginTop:'8px'}},
        h('button',{'data-ghost':true,onClick:()=>this.closeModal(),style:{background:'transparent',border:'1px solid '+C.border,color:C.muted,borderRadius:'10px',padding:'10px 18px',fontWeight:600,fontSize:'13.5px',cursor:'pointer'}},'Cancel'),
        h('button',{'data-pri':true,disabled:!canSave,onClick:()=>{ this.saveItem(m.loc, d); this.closeModal(); },
          style:{background:canSave?C.accent:'rgba(216,162,74,.3)',color:C.bg,border:'none',borderRadius:'10px',padding:'10px 20px',fontWeight:600,fontSize:'13.5px',cursor:canSave?'pointer':'default'}}, isEdit?'Save':'Add'))
    );
  }
  onFile(e, m){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const set = (patch)=> this.setState(st=> st.modal ? {modal:{...st.modal, draft:{...st.modal.draft,...patch}}} : {});
    set({fileName:f.name, size:f.size, mime:f.type, title:m.draft.title||f.name.replace(/\.[^.]+$/,'')});
    const r = new FileReader();
    r.onload = ()=> set({dataUrl: r.result});
    if(f.size <= 3.5*1048576) r.readAsDataURL(f);
    else { set({dataUrl:''}); /* too large to persist */ }
  }

  modalHead(title){
    return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'18px'}},
      h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'18px'}}, title),
      h('button',{'data-btn':true,onClick:()=>this.closeModal(),style:{width:'30px',height:'30px',borderRadius:'8px',border:'1px solid '+C.border,background:'transparent',color:C.muted,cursor:'pointer',fontSize:'13px'}},'✕'));
  }

  noteViewBody(m){
    const it=m.item;
    return h('div',{style:{padding:'24px'}},
      this.modalHead(it.title||'Note'),
      h('div',{style:{fontSize:'15px',lineHeight:1.6,color:C.text,whiteSpace:'pre-wrap'}}, it.text||'')
    );
  }

  folderViewBody(m){
    const sec = this.state.sections.find(s=>s.id===m.sectionId);
    const folder = sec && sec.items.find(i=>i.id===m.folderId);
    if(!folder) return h('div',{style:{padding:'24px'}}, 'Folder not found');
    const loc = {sectionId:m.sectionId, folderId:m.folderId};
    const edit = this.state.edit;
    const grid = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(160px, 1fr))',gridAutoRows:'118px',gridAutoFlow:'row dense',gap:'16px'},
        onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='item') e.preventDefault(); }:null,
        onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='item'){ e.preventDefault(); this.moveItem(this._drag.loc,this._drag.index, loc, null); this._drag=null; } }:null },
      folder.items.map((it,i)=> this.renderCard(it, loc, i)),
      this.addTile(loc)
    );
    return h('div',{style:{padding:'24px'}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'18px'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
          h('span',{style:{color:C.accent,fontSize:'15px'}},'📁'),
          h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'19px'}}, folder.name),
          h('span',{style:{fontSize:'12px',color:C.faint}}, 'in '+sec.title)),
        h('button',{'data-btn':true,onClick:()=>this.closeModal(),style:{width:'30px',height:'30px',borderRadius:'8px',border:'1px solid '+C.border,background:'transparent',color:C.muted,cursor:'pointer'}},'✕')),
      folder.items.length===0 && !edit ? h('div',{style:{color:C.muted,fontSize:'13px',marginBottom:'14px'}},'This folder is empty. Hold Ctrl and use Add, or drag cards onto the folder.') : null,
      grid
    );
  }
}

if(window.React && window.ReactDOM){
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
}
</script>
</body>
</html>
