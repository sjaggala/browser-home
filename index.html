<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f5f6fa;
      --accent: #4f46e5;
      --accent-light: #ede9fe;
      --accent2: #ef4444;
      --text: #1e1e2e;
      --muted: #9ca3af;
      --border: #e2e4ea;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --radius: 14px;
      --card-size: 110px;
      --gap: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    #clock {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    #clock .time-main {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    #topbar-right { display: flex; gap: 8px; align-items: center; }

    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-ghost {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4338ca; }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: 1rem;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

    /* ── Search zone — fixed height, never moves ── */
    #search-zone {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 24px 28px;
      gap: 20px;
      background: var(--bg);
    }

    /* ── Bookmark zone — takes remaining space, scrolls independently ── */
    #bm-zone {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 48px;
    }

    /* legacy — unused */
    #stage-inner {
      display: none;
    }

    /* ── Search ── */
    #search-wrap {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #search-greeting {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    #search-bar {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 40px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }
    #search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    #search-input {
      flex: 1;
      padding: 11px 20px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    #search-input::placeholder { color: var(--muted); }

    #search-btn {
      padding: 8px 16px 8px 8px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.15s;
      display: flex;
      align-items: center;
    }
    #search-btn:hover { color: var(--accent); }

    /* ── Section nav — plain text labels ── */
    #section-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .section-tab {
      background: none;
      border: none;
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.15s;
      letter-spacing: 0.2px;
      position: relative;
    }
    .section-tab:hover { color: var(--text); }
    .section-tab.active {
      color: var(--text);
      font-weight: 700;
    }
    /* underline indicator for active */
    .section-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Edit-mode inline rename */
    .section-tab-edit-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .section-tab-input {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-light);
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      padding: 3px 8px;
      outline: none;
      width: 100px;
    }
    .section-tab-del {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent2);
      border: none;
      color: #fff;
      font-size: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* separator dot between tabs */
    .tab-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .add-section-tab {
      background: none;
      border: 1.5px dashed var(--border);
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .add-section-tab:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

    /* ── Bookmark grid ── */
    #bm-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #bm-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
      justify-content: center;
    }

    /* ── Bookmark card ── */
    .bookmark-card {
      position: relative;
      width: var(--card-size);
      height: var(--card-size);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      padding: 8px;
      box-shadow: var(--shadow);
    }
    .bookmark-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(79,70,229,0.14);
      border-color: var(--accent);
    }
    .bookmark-card img {
      width: 44px; height: 44px;
      object-fit: contain;
      border-radius: 8px;
    }
    .bookmark-card .letter-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 700;
      color: var(--accent);
    }
    .bookmark-card .bm-name {
      font-size: 0.68rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
      word-break: break-word;
      max-width: 100%;
      color: var(--muted);
    }

    .card-del-btn {
      position: absolute;
      top: 4px; right: 4px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent2);
      border: none; color: #fff;
      font-size: 11px; line-height: 18px;
      text-align: center;
      cursor: pointer;
      display: none; z-index: 2;
    }
    body.edit-mode .card-del-btn { display: block !important; }
    body.edit-mode .bookmark-card {
      animation: wiggle 0.35s ease infinite alternate;
    }
    @keyframes wiggle {
      from { transform: rotate(-1.2deg); }
      to   { transform: rotate(1.2deg); }
    }
    body.edit-mode .bookmark-card:hover { animation: none; }

    /* ── Add placeholder card ── */
    .add-card {
      width: var(--card-size);
      height: var(--card-size);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 5px;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-size: 0.7rem; font-weight: 600;
    }
    .add-card:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .add-card .plus { font-size: 1.5rem; line-height: 1; font-weight: 300; }

    /* ── Empty hint ── */
    #bm-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      padding: 10px 0 0;
    }
    #bm-empty .empty-icon { font-size: 1.8rem; }

    /* ── Settings panel ── */
    .panel-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      backdrop-filter: blur(2px);
    }
    .panel-overlay.open { opacity: 1; pointer-events: all; }

    #settings-panel {
      margin: 52px 16px 0 0;
      width: 300px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex; flex-direction: column;
      gap: 18px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.12);
    }
    #settings-panel h3 { font-size: 0.92rem; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    .setting-row { display: flex; flex-direction: column; gap: 5px; }
    .setting-row label { font-size: 0.75rem; font-weight: 700; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; }
    .setting-row input {
      padding: 8px 12px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text); font-size: 0.9rem;
      outline: none; transition: border-color 0.15s;
    }
    .setting-row input:focus { border-color: var(--accent); }
    .setting-row .hint { font-size: 0.72rem; color: var(--muted); }

    /* ── Bookmark modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.22);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      width: 400px; max-width: 95vw;
      display: flex; flex-direction: column;
      gap: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.14);
    }
    .modal h2 { font-size: 1rem; color: var(--accent); font-weight: 700; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 0.75rem; color: var(--muted); font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
    .field input, .field select {
      padding: 8px 12px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text); font-size: 0.9rem;
      outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }

    #img-preview-wrap { display: flex; align-items: flex-start; gap: 12px; }
    #img-preview {
      width: 50px; height: 50px; border-radius: 10px; object-fit: contain;
      background: var(--surface2); border: 1px solid var(--border);
      display: none; flex-shrink: 0;
    }
    #img-preview.visible { display: block; }
    #img-placeholder {
      width: 50px; height: 50px; border-radius: 10px;
      background: var(--surface2); border: 1.5px dashed var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: var(--muted); flex-shrink: 0;
    }
    .img-options { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .img-options small { color: var(--muted); font-size: 0.72rem; }
    .favicon-link { font-size: 0.72rem; color: var(--accent); cursor: pointer; font-weight: 600; }
    .favicon-link:hover { text-decoration: underline; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--accent); color: #fff;
      padding: 8px 20px; border-radius: 30px;
      font-size: 0.82rem; font-weight: 600;
      opacity: 0; transition: opacity 0.25s, transform 0.25s;
      pointer-events: none; z-index: 300;
      box-shadow: 0 4px 16px rgba(79,70,229,0.28);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div id="clock">
    <span id="clock-day"></span>
    <span class="time-main" id="clock-time"></span>
    <span id="clock-ampm"></span>
  </div>
  <div id="topbar-right">
    <button class="btn btn-ghost" id="edit-btn" onclick="toggleEditMode()">Edit</button>
    <div class="icon-btn" title="Settings" onclick="openSettings()">⚙</div>
  </div>
</div>

<!-- Fixed search zone — never shifts regardless of bookmark count -->
<div id="search-zone">
  <div id="search-wrap">
    <div id="search-greeting"></div>
    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Search Google…" autocomplete="off" />
      <button id="search-btn" onclick="doSearch()" title="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
  </div>
  <!-- Section labels sit just below search, also fixed -->
  <div id="section-nav"></div>
</div>

<!-- Scrollable bookmark zone — grows/shrinks independently -->
<div id="bm-zone">
  <div id="bm-area">
    <div id="bm-grid"></div>
    <div id="bm-empty">
      <span class="empty-icon">🔖</span>
      <span>No bookmarks yet — click <strong>+</strong> to add one</span>
    </div>
  </div>
</div>

<!-- Settings panel -->
<div class="panel-overlay" id="settings-overlay" onclick="closeSettingsOnOverlay(event)">
  <div id="settings-panel">
    <h3>⚙ Settings</h3>
    <div class="setting-row">
      <label>Your name</label>
      <input id="set-username" type="text" placeholder="e.g. Alex" oninput="applySettings()" />
      <span class="hint">Shown in greeting: "Good morning, Alex"</span>
    </div>
    <div class="setting-row">
      <label>Grid columns</label>
      <input id="grid-size-input" type="number" min="1" max="20" value="6" oninput="updateCols(this.value)" />
      <span class="hint">Number of bookmark columns per row</span>
    </div>
    <button class="btn btn-ghost" style="align-self:flex-end;margin-top:4px" onclick="closeSettings()">Close</button>
  </div>
</div>

<!-- Bookmark modal -->
<div class="modal-overlay" id="bm-modal-overlay" onclick="closeOnOverlay(event,'bm-modal-overlay',closeBmModal)">
  <div class="modal">
    <h2 id="bm-modal-title">Add Bookmark</h2>
    <div class="field">
      <label>Name</label>
      <input id="bm-name" type="text" placeholder="e.g. GitHub" />
    </div>
    <div class="field">
      <label>URL</label>
      <input id="bm-url" type="url" placeholder="https://example.com" oninput="autoFetchFavicon()" />
    </div>
    <div class="field">
      <label>Section</label>
      <select id="bm-section"></select>
    </div>
    <div class="field">
      <label>Logo / Image</label>
      <div id="img-preview-wrap">
        <div id="img-placeholder">🌐</div>
        <img id="img-preview" alt="preview" />
        <div class="img-options">
          <input id="bm-img-url" type="url" placeholder="Paste image URL…" oninput="previewImgUrl(this.value)" />
          <small>— or upload —</small>
          <input id="bm-img-file" type="file" accept="image/*" onchange="previewImgFile(this)" />
          <span class="favicon-link" onclick="useFavicon()">↻ Use site favicon</span>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeBmModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBookmark()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── State ── */
const STORAGE_KEY = 'hp_home'; // permanent — never change this again
const LEGACY_KEYS = ['hp_data4', 'hp_data3', 'hp_data2', 'hp_data'];

let data = loadData();
let editMode = false;
let activeSection = data.sections[0]?.id || null;
let editingBm = null;
let pendingImgDataUrl = null;

function loadData() {
  // Try the stable key first
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (d && Array.isArray(d.sections) && d.sections.length) return d;
  } catch(_) {}
  // Migrate from any legacy key (newest to oldest)
  for (const key of LEGACY_KEYS) {
    try {
      const d = JSON.parse(localStorage.getItem(key) || 'null');
      if (d && Array.isArray(d.sections) && d.sections.length) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); // promote to stable key
        return d;
      }
    } catch(_) {}
  }
  return { sections: [{ id: uid(), name: 'General', bookmarks: [] }], cols: 6, username: '' };
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function uid() { return Math.random().toString(36).slice(2, 10); }

/* ── Clock ── */
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function tick() {
  const now = new Date();
  let h = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock-day').textContent = DAYS[now.getDay()] + ', ';
  document.getElementById('clock-time').textContent = `${h}:${m} `;
  document.getElementById('clock-ampm').textContent = ampm;

  const hr = now.getHours();
  const name = data.username ? `, ${data.username}` : '';
  const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('search-greeting').textContent = greet + name;
}
tick();
setInterval(tick, 15000);

/* ── Search ── */
document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
}

/* ── Settings ── */
function openSettings() {
  document.getElementById('set-username').value = data.username || '';
  document.getElementById('grid-size-input').value = data.cols || 6;
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings() { document.getElementById('settings-overlay').classList.remove('open'); }
function closeSettingsOnOverlay(e) { if (e.target === document.getElementById('settings-overlay')) closeSettings(); }
function applySettings() {
  data.username = document.getElementById('set-username').value.trim();
  saveData(); tick();
}

/* ── Grid cols ── */
function updateCols(v) {
  v = Math.max(1, Math.min(20, parseInt(v) || 6));
  data.cols = v;
  document.getElementById('grid-size-input').value = v;
  document.documentElement.style.setProperty('--card-size', v >= 10 ? '88px' : v >= 7 ? '100px' : '110px');
  saveData();
}
updateCols(data.cols);

/* ── Edit mode ── */
function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('edit-btn').textContent = editMode ? 'Done' : 'Edit';
  renderNav();
  renderGrid();
}

/* ── Nav ── */
function renderNav() {
  const nav = document.getElementById('section-nav');
  nav.innerHTML = '';

  data.sections.forEach((sec, idx) => {
    // Separator dot between tabs
    if (idx > 0) {
      const dot = document.createElement('span');
      dot.className = 'tab-dot';
      nav.appendChild(dot);
    }

    if (editMode) {
      const wrap = document.createElement('div');
      wrap.className = 'section-tab-edit-wrap';

      const inp = document.createElement('input');
      inp.className = 'section-tab-input';
      inp.value = sec.name;
      inp.title = 'Rename section';
      inp.addEventListener('input', () => {
        sec.name = inp.value;
        saveData();
      });
      inp.addEventListener('blur', () => {
        sec.name = inp.value.trim() || 'Untitled';
        inp.value = sec.name;
        saveData();
        renderNav();
      });
      inp.addEventListener('click', () => {
        if (activeSection !== sec.id) {
          activeSection = sec.id;
          renderNav();   // re-renders; new input gets focus naturally
          renderGrid();
        }
        // if already active section, do nothing — let the cursor land in the input normally
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'section-tab-del';
      delBtn.textContent = '✕';
      delBtn.title = 'Delete section';
      delBtn.onclick = () => deleteSection(sec.id);

      wrap.appendChild(inp);
      wrap.appendChild(delBtn);
      nav.appendChild(wrap);
    } else {
      const tab = document.createElement('button');
      tab.className = 'section-tab' + (sec.id === activeSection ? ' active' : '');
      tab.textContent = sec.name;
      tab.onclick = () => { activeSection = sec.id; renderNav(); renderGrid(); };
      nav.appendChild(tab);
    }
  });

  // Separator before add button
  if (data.sections.length > 0) {
    const dot = document.createElement('span');
    dot.className = 'tab-dot';
    nav.appendChild(dot);
  }

  const addTab = document.createElement('button');
  addTab.className = 'add-section-tab';
  addTab.textContent = '＋ Section';
  addTab.onclick = addSection;
  nav.appendChild(addTab);
}

/* ── Grid ── */
function renderGrid() {
  const grid = document.getElementById('bm-grid');
  const empty = document.getElementById('bm-empty');
  grid.innerHTML = '';

  const sec = data.sections.find(s => s.id === activeSection);
  if (!sec) { empty.style.display = 'flex'; return; }

  empty.style.display = sec.bookmarks.length === 0 ? 'flex' : 'none';

  sec.bookmarks.forEach((bm, i) => grid.appendChild(makeCard(bm, i, sec.id)));

  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.title = 'Add bookmark';
  addCard.onclick = () => openAddBmModal(sec.id);
  addCard.innerHTML = `<span class="plus">+</span><span>Add</span>`;
  grid.appendChild(addCard);

  saveData();
}

function makeCard(bm, i, sectionId) {
  const a = document.createElement('a');
  a.className = 'bookmark-card';
  a.href = bm.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';

  if (bm.img) {
    const img = document.createElement('img');
    img.src = bm.img; img.alt = bm.name;
    img.onerror = () => img.replaceWith(letterIcon(bm.name));
    a.appendChild(img);
  } else {
    a.appendChild(letterIcon(bm.name));
  }

  const span = document.createElement('span');
  span.className = 'bm-name';
  span.textContent = bm.name;
  a.appendChild(span);

  const del = document.createElement('button');
  del.className = 'card-del-btn';
  del.textContent = '×';
  del.onclick = e => { e.preventDefault(); e.stopPropagation(); deleteBm(sectionId, i); };
  a.appendChild(del);

  a.addEventListener('click', e => { if (editMode) { e.preventDefault(); openEditBmModal(sectionId, i); } });
  return a;
}

function letterIcon(name) {
  const div = document.createElement('div');
  div.className = 'letter-icon';
  div.textContent = name ? name[0].toUpperCase() : '?';
  return div;
}

/* ── Sections ── */
function addSection() {
  const sec = { id: uid(), name: 'New Section', bookmarks: [] };
  data.sections.push(sec);
  activeSection = sec.id;
  saveData(); renderNav(); renderGrid();
  toast('Section added — click Edit to rename it');
}

function deleteSection(id) {
  if (data.sections.length === 1) { toast("Can't delete the last section"); return; }
  const sec = data.sections.find(s => s.id === id);
  if (sec?.bookmarks.length > 0 && !confirm(`Delete "${sec.name}" and its ${sec.bookmarks.length} bookmark(s)?`)) return;
  data.sections = data.sections.filter(s => s.id !== id);
  activeSection = data.sections[0].id;
  saveData(); renderNav(); renderGrid();
  toast('Section removed');
}

/* ── Bookmarks ── */
function deleteBm(sectionId, i) {
  const sec = data.sections.find(s => s.id === sectionId);
  if (sec) { sec.bookmarks.splice(i, 1); renderGrid(); toast('Bookmark removed'); }
}

function openAddBmModal(sectionId) {
  editingBm = null;
  clearBmModal();
  document.getElementById('bm-modal-title').textContent = 'Add Bookmark';
  populateSectionSelect(sectionId);
  document.getElementById('bm-modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('bm-name').focus(), 100);
}

function openEditBmModal(sectionId, i) {
  const sec = data.sections.find(s => s.id === sectionId);
  if (!sec) return;
  const bm = sec.bookmarks[i];
  editingBm = { sectionId, bmIndex: i };
  document.getElementById('bm-name').value = bm.name || '';
  document.getElementById('bm-url').value = bm.url || '';
  document.getElementById('bm-img-url').value = '';
  pendingImgDataUrl = null;
  if (bm.img) showImgPreview(bm.img); else clearImgPreview();
  document.getElementById('bm-modal-title').textContent = 'Edit Bookmark';
  populateSectionSelect(sectionId);
  document.getElementById('bm-modal-overlay').classList.add('open');
}

function populateSectionSelect(selectedId) {
  const sel = document.getElementById('bm-section');
  sel.innerHTML = '';
  data.sections.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id; opt.textContent = s.name;
    if (s.id === selectedId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function closeBmModal() {
  document.getElementById('bm-modal-overlay').classList.remove('open');
  clearBmModal();
}

function closeOnOverlay(e, id, fn) { if (e.target === document.getElementById(id)) fn(); }

function clearBmModal() {
  ['bm-name','bm-url','bm-img-url'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('bm-img-file').value = '';
  pendingImgDataUrl = null;
  clearImgPreview();
}

function saveBookmark() {
  const name = document.getElementById('bm-name').value.trim();
  let url = document.getElementById('bm-url').value.trim();
  const imgUrl = document.getElementById('bm-img-url').value.trim();
  const targetSectionId = document.getElementById('bm-section').value;

  if (!name) { toast('Please enter a name'); return; }
  if (!url)  { toast('Please enter a URL'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  let img = pendingImgDataUrl || imgUrl || null;
  if (!img) {
    try { img = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(url).origin)}&sz=64`; } catch(_) {}
  }

  if (editingBm) {
    const old = data.sections.find(s => s.id === editingBm.sectionId);
    if (old) old.bookmarks.splice(editingBm.bmIndex, 1);
    const nw = data.sections.find(s => s.id === targetSectionId);
    if (nw) nw.bookmarks.push({ name, url, img });
    toast('Bookmark updated');
  } else {
    const sec = data.sections.find(s => s.id === targetSectionId);
    if (sec) sec.bookmarks.push({ name, url, img });
    toast('Bookmark added');
  }

  closeBmModal();
  if (targetSectionId !== activeSection) { activeSection = targetSectionId; renderNav(); }
  renderGrid();
}

/* ── Image ── */
function showImgPreview(src) {
  document.getElementById('img-preview').src = src;
  document.getElementById('img-preview').classList.add('visible');
  document.getElementById('img-placeholder').style.display = 'none';
}
function clearImgPreview() {
  document.getElementById('img-preview').src = '';
  document.getElementById('img-preview').classList.remove('visible');
  document.getElementById('img-placeholder').style.display = 'flex';
}
function previewImgUrl(url) { pendingImgDataUrl = null; if (url) showImgPreview(url); else clearImgPreview(); }
function previewImgFile(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { pendingImgDataUrl = e.target.result; showImgPreview(pendingImgDataUrl); };
  reader.readAsDataURL(file);
}
function autoFetchFavicon() {
  const url = document.getElementById('bm-url').value.trim();
  if (!document.getElementById('bm-img-url').value && !pendingImgDataUrl && url) {
    try { showImgPreview(`https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(url).origin)}&sz=64`); } catch(_) {}
  }
}
function useFavicon() {
  const url = document.getElementById('bm-url').value.trim();
  if (!url) { toast('Enter a URL first'); return; }
  try {
    const fav = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(url).origin)}&sz=64`;
    document.getElementById('bm-img-url').value = fav;
    showImgPreview(fav); pendingImgDataUrl = null;
  } catch(_) { toast('Invalid URL'); }
}

/* ── Toast ── */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── Init ── */
renderNav();
renderGrid();
</script>
</body>
</html>
