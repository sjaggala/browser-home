<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{
    --bg:#1A1815; --surface:rgba(255,255,255,.035); --surface-solid:#242019;
    --border:rgba(255,255,255,.09); --text:#EDE9E0; --muted:#9a9484; --faint:#6f6a5d;
    --accent:#D8A24A; --accent-ink:#D8A24A;
    --chip:rgba(255,255,255,.05); --dash:rgba(255,255,255,.16); --input-bg:rgba(255,255,255,.04);
    --hover:rgba(255,255,255,.07); --dot:rgba(255,255,255,.18);
    --header-bg:rgba(26,24,21,.82); --modal-bg:#23201a;
    --glow:rgba(216,162,74,.06); --card-shadow:rgba(0,0,0,.65);
    --kbd-bg:rgba(255,255,255,.07); --kbd-border:rgba(255,255,255,.12); --kbd-text:#cfc8b8;
    --scroll-thumb:#3a342a;
  }
  body[data-theme="light"]{
    --bg:#F3EFE7; --surface:#FFFFFF; --surface-solid:#FFFFFF;
    --border:rgba(40,30,15,.13); --text:#2C271F; --muted:#6f6757; --faint:#a39b89;
    --accent:#D8A24A; --accent-ink:#9a6512;
    --chip:rgba(40,30,15,.05); --dash:rgba(40,30,15,.18); --input-bg:rgba(40,30,15,.04);
    --hover:rgba(40,30,15,.06); --dot:rgba(40,30,15,.2);
    --header-bg:rgba(248,245,238,.86); --modal-bg:#FFFFFF;
    --glow:rgba(216,162,74,.1); --card-shadow:rgba(40,30,15,.16);
    --kbd-bg:rgba(40,30,15,.06); --kbd-border:rgba(40,30,15,.16); --kbd-text:#6f6757;
    --scroll-thumb:#cfc6b5;
  }
  body{background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease}
  ::selection{background:#D8A24A;color:#1A1815}
  input,textarea,button,select{font-family:inherit;color:inherit}
  input:focus,textarea:focus{outline:none}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{filter:brightness(1.2)}
  @keyframes bm-pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes bm-fade{from{opacity:0}to{opacity:1}}
  [data-card]{transition:transform .16s cubic-bezier(.2,.7,.3,1),border-color .16s,box-shadow .16s}
  [data-card]:hover{transform:translateY(-3px);border-color:rgba(216,162,74,.55)!important;box-shadow:0 12px 28px -12px var(--card-shadow)}
  [data-card]:active{transform:translateY(-1px) scale(.995)}
  [data-add]:hover{border-color:rgba(216,162,74,.6)!important;color:#D8A24A!important;background:rgba(216,162,74,.05)!important}
  [data-btn]{transition:color .14s,border-color .14s,transform .1s}
  [data-btn]:hover{background:var(--hover)}
  [data-btn]:active{transform:scale(.93)}
  [data-pri]:hover{background:#e6b15c!important}
  [data-ghost]:hover{background:var(--hover)}
  [data-pick]:hover{border-color:rgba(216,162,74,.55)!important;background:rgba(216,162,74,.06)!important;transform:translateY(-2px)}
  [data-handle]{cursor:grab}
  [data-handle]:active{cursor:grabbing}
  [data-drop-on]{outline:2px dashed rgba(216,162,74,.7);outline-offset:3px}
  input[data-inp],textarea[data-inp]{transition:border-color .14s}
  input[data-inp]:focus,textarea[data-inp]:focus{border-color:rgba(216,162,74,.7)!important;background:var(--hover)!important}
  [data-secname]:hover{background:var(--hover)}
  [data-nav]:hover{background:var(--hover)!important;color:var(--text)!important}
  [data-nav]{transition:color .14s}
  [data-mv]:hover{background:rgba(216,162,74,.85)!important;color:#1A1815!important}
  [data-hoveredit]{opacity:0;transition:opacity .14s}
  [data-card]:hover [data-hoveredit], [data-sechdr]:hover [data-hoveredit]{opacity:1}
  [data-sidesec].bm-dragover{outline:2px dashed rgba(216,162,74,.7);outline-offset:-2px;border-radius:9px}
  aside::-webkit-scrollbar{width:7px}
  #boot-msg{font-family:'Hanken Grotesk',system-ui,sans-serif;color:#9a9484;text-align:center;padding:90px 20px}

<div id="root"><div id="boot-msg">Loading bookmarks…<br><br><span style="font-size:13px">If this message stays, you appear to be offline — this page needs an internet connection on first load to fetch its UI engine.</span></div></div>

<script>
const KEY = 'bm.sections.v3';
const THEME_KEY = 'bm.theme';
const VIEW_KEY = 'bm.viewmode';
const C = {
  bg:'var(--bg)', surface:'var(--surface)', surfaceSolid:'var(--surface-solid)',
  border:'var(--border)', text:'var(--text)', muted:'var(--muted)', faint:'var(--faint)',
  accent:'var(--accent)', accentInk:'var(--accent-ink)', onAccent:'#211B12',
  chip:'var(--chip)', dash:'var(--dash)', inputBg:'var(--input-bg)', surfaceLite:'var(--surface)',
  dot:'var(--dot)', modalBg:'var(--modal-bg)'
};
const CHIP = ['#C26B40','#4079C2','#3F9E72','#9466C2','#C2A340','#C2466A','#3FA9A9'];
const h = React.createElement;

// ---- Feather-style line icon set ----
function svgIcon(paths, o){ o=o||{}; return h('svg',{width:o.size||16,height:o.size||16,viewBox:'0 0 24 24',fill:o.fill?'currentColor':'none',stroke:o.fill?'none':'currentColor',strokeWidth:o.sw||2,strokeLinecap:'round',strokeLinejoin:'round'}, paths); }
const IC = {
  left:(s)=>svgIcon(h('polyline',{points:'15 18 9 12 15 6'}),{size:s||14}),
  right:(s)=>svgIcon(h('polyline',{points:'9 18 15 12 9 6'}),{size:s||14}),
  down:(s)=>svgIcon(h('polyline',{points:'6 9 12 15 18 9'}),{size:s||16}),
  x:(s)=>svgIcon([h('line',{key:1,x1:18,y1:6,x2:6,y2:18}),h('line',{key:2,x1:6,y1:6,x2:18,y2:18})],{size:s||14}),
  edit:(s)=>svgIcon([h('path',{key:1,d:'M12 20h9'}),h('path',{key:2,d:'M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z'})],{size:s||14}),
  archive:(s)=>svgIcon([h('polyline',{key:1,points:'21 8 21 21 3 21 3 8'}),h('rect',{key:2,x:1,y:3,width:22,height:5,rx:1}),h('line',{key:3,x1:10,y1:12,x2:14,y2:12})],{size:s||14}),
  more:(s)=>svgIcon([h('circle',{key:1,cx:12,cy:5,r:1.7}),h('circle',{key:2,cx:12,cy:12,r:1.7}),h('circle',{key:3,cx:12,cy:19,r:1.7})],{size:s||16,fill:1}),
  out:(s)=>svgIcon([h('polyline',{key:1,points:'9 14 4 9 9 4'}),h('path',{key:2,d:'M20 20v-7a4 4 0 0 0-4-4H4'})],{size:s||14}),
  grip:(s)=>svgIcon([[9,6],[15,6],[9,12],[15,12],[9,18],[15,18]].map((p,i)=>h('circle',{key:i,cx:p[0],cy:p[1],r:1.4})),{size:s||16,fill:1}),
};

function uid(){ return Math.random().toString(36).slice(2,9); }
function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function faviconOf(u){ const d=domainOf(u); return d?('https://icons.duckduckgo.com/ip3/'+d+'.ico'):''; }
function hashNum(s){ let n=0; s=s||''; for(let i=0;i<s.length;i++) n=(n*31 + s.charCodeAt(i))>>>0; return n; }
function chipColor(s){ return CHIP[hashNum(s)%CHIP.length]; }
function extOf(name){ const m=(name||'').split('.'); return m.length>1 ? m.pop().toUpperCase().slice(0,4) : 'FILE'; }
function fmtSize(b){ if(!b&&b!==0) return ''; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function seed(){
  return [
    { id:uid(), title:'Daily', items:[
      { id:uid(), type:'link', title:'Gmail', url:'https://mail.google.com' },
      { id:uid(), type:'link', title:'Calendar', url:'https://calendar.google.com' },
      { id:uid(), type:'link', title:'GitHub', url:'https://github.com' },
      { id:uid(), type:'note', title:'Standup', text:'Daily standup 9:30am.\nShare blockers in #team channel.' },
    ]},
    { id:uid(), title:'Watchlist', items:[
      { id:uid(), type:'poster', title:'Dune: Part Two', image:'', url:'' },
      { id:uid(), type:'poster', title:'Severance', image:'', url:'' },
      { id:uid(), type:'poster', title:'The Bear', image:'', url:'' },
      { id:uid(), type:'link', title:'Letterboxd', url:'https://letterboxd.com' },
    ]},
    { id:uid(), title:'Work', items:[
      { id:uid(), type:'file', title:'Q3 Report', fileName:'Q3-report.pdf', size:284000, mime:'application/pdf', dataUrl:'' },
      { id:uid(), type:'file', title:'Brand Designs', fileName:'designs.fig', size:1840000, mime:'', dataUrl:'' },
      { id:uid(), type:'folder', name:'References', items:[
        { id:uid(), type:'link', title:'Dribbble', url:'https://dribbble.com' },
        { id:uid(), type:'link', title:'Figma', url:'https://figma.com' },
      ]},
    ]},
  ];
}

// First-run data: existing v3 → migrate old browser-home (hp_home) → seed demo
function loadInitial(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(Array.isArray(d)&&d.length) return d; } }catch(e){}
  try{
    const oldRaw = localStorage.getItem('hp_home');
    if(oldRaw){
      const old = JSON.parse(oldRaw);
      if(old && Array.isArray(old.sections) && old.sections.length){
        const conv = old.sections.map(s=>({
          id: uid(),
          title: s.name || 'Section',
          items: (s.bookmarks||[]).map(b=>{
            if(b.type==='movie') return {id:uid(),type:'poster',title:b.name||'',image:(b.img&&!String(b.img).includes('s2/favicons'))?b.img:'',url:b.url||''};
            return {id:uid(),type:'link',title:b.name||'',url:b.url||''};
          })
        }));
        if(conv.length) return conv;
      }
    }
  }catch(e){}
  return seed();
}

class App extends React.Component {
  constructor(p){
    super(p);
    let theme='dark';
    try{ const t=localStorage.getItem(THEME_KEY); if(t==='light'||t==='dark') theme=t; }catch(e){}
    let viewMode='sections';
    try{ const v=localStorage.getItem(VIEW_KEY); if(v==='sections'||v==='groups') viewMode=v; }catch(e){}
    this.state = { sections: loadInitial(), edit:false, query:'', modal:null, hover:null, dragOverSec:null, activeSec:null, theme, viewMode, groupOpen:null, settingsOpen:false, renaming:null, menu:null };
    try{ document.body.setAttribute('data-theme', theme); }catch(e){}
    this._drag = null;
  }
  applyTheme(){ try{ document.body.setAttribute('data-theme', this.state.theme); }catch(e){} }
  toggleTheme(){ const theme = this.state.theme==='dark'?'light':'dark'; this.setState({theme}, ()=>{ this.applyTheme(); try{ localStorage.setItem(THEME_KEY, theme); }catch(e){} }); }
  setViewMode(mode){ if(mode===this.state.viewMode) return; this.setState({viewMode:mode, groupOpen:null}); try{ localStorage.setItem(VIEW_KEY, mode); }catch(e){} }
  openGroup(id){ this.setState({groupOpen:id}); }
  closeGroup(){ this.setState({groupOpen:null}); }
  componentDidMount(){
    this.applyTheme();
    this._onScroll = ()=>{
      const secs = this.state.sections; let cur=null;
      for(const s of secs){ const el=document.getElementById('bm-sec-'+s.id); if(!el) continue; if(el.getBoundingClientRect().top<=140) cur=s.id; }
      if(!cur && secs.length) cur=secs[0].id;
      if(cur!==this.state.activeSec) this.setState({activeSec:cur});
    };
    window.addEventListener('scroll', this._onScroll, {passive:true});
    setTimeout(this._onScroll, 120);
  }
  componentWillUnmount(){
    window.removeEventListener('scroll', this._onScroll);
  }
  scrollToSection(id){
    const el = document.getElementById('bm-sec-'+id);
    if(!el) return;
    const se = document.scrollingElement || document.documentElement;
    const start = se.scrollTop;
    const target = Math.max(0, start + el.getBoundingClientRect().top - 84);
    this.setState({activeSec:id});
    if(this._raf) cancelAnimationFrame(this._raf);
    const dur = 380, t0 = performance.now();
    const step = (now)=>{
      const p = Math.min(1, (now - t0)/dur);
      const e = 1 - Math.pow(1-p, 3);
      se.scrollTop = start + (target - start)*e;
      if(p < 1) this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }
  save(){
    try{ localStorage.setItem(KEY, JSON.stringify(this.state.sections)); }
    catch(e){ if(!this._warned){ this._warned=true; alert('Browser storage is full — very large files may not be saved, but links, notes and smaller files will persist.'); } }
  }
  update(mutator){
    const next = (typeof structuredClone==='function') ? structuredClone(this.state.sections) : JSON.parse(JSON.stringify(this.state.sections));
    mutator(next);
    this.setState({sections: next}, ()=>this.save());
  }
  containerOf(secs, loc){
    const s = secs.find(x=>x.id===loc.sectionId); if(!s) return null;
    if(loc.folderId){ const f=s.items.find(i=>i.id===loc.folderId); return f?f.items:null; }
    return s.items;
  }
  sameLoc(a,b){ return a.sectionId===b.sectionId && (a.folderId||null)===(b.folderId||null); }

  // ---- sections ----
  addSection(){ const id=uid(); this.update(n=>{ n.unshift({id, title:'New Section', items:[]}); }); setTimeout(()=>this.setState({renaming:id}), 30); }
  renameSection(id, title){ this.update(n=>{ const s=n.find(x=>x.id===id); if(s) s.title=title; }); }
  deleteSection(id){ if(!confirm('Delete this whole section?')) return; this.update(n=>{ const i=n.findIndex(x=>x.id===id); if(i>=0) n.splice(i,1); }); }
  moveSectionTo(from,to){ this.update(n=>{ if(from<0||from>=n.length||to<0||to>=n.length||from===to) return; const [s]=n.splice(from,1); n.splice(to,0,s); }); }
  reorderSections(fromId,toId){ if(fromId===toId) return; this.update(n=>{ const from=n.findIndex(s=>s.id===fromId); if(from<0) return; const [s]=n.splice(from,1); let to=n.findIndex(x=>x.id===toId); if(to<0){ n.push(s); return; } n.splice(to,0,s); }); }
  toggleEdit(){ this.setState({edit:!this.state.edit}); }
  toggleCollapse(id){ this.update(n=>{ const s=n.find(x=>x.id===id); if(s) s.collapsed=!s.collapsed; }); }
  archiveSection(id, val){ this.update(n=>{ const s=n.find(x=>x.id===id); if(s) s.archived = (val===undefined?true:val); }); }
  archiveItem(loc, id, val){ this.update(n=>{ const c=this.containerOf(n,loc); if(!c) return; const it=c.find(x=>x.id===id); if(it) it.archived = (val===undefined?true:val); }); }
  hasArchived(){ return this.state.sections.some(s=> s.archived || s.items.some(it=> it.archived || (it.type==='folder' && it.items && it.items.some(c=>c.archived)))); }

  // ---- items ----
  addItem(loc, item){ this.update(n=>{ const c=this.containerOf(n,loc); if(c) c.push(item); }); }
  saveItem(loc, item){ this.update(n=>{ const c=this.containerOf(n,loc); if(!c) return; const i=c.findIndex(x=>x.id===item.id); if(i>=0) c[i]=item; else c.push(item); }); }
  deleteItem(loc, id){ this.update(n=>{ const c=this.containerOf(n,loc); if(!c) return; const i=c.findIndex(x=>x.id===id); if(i>=0) c.splice(i,1); }); }
  moveItem(fromLoc, fromIdx, toLoc, toIdx){
    this.update(n=>{
      const from=this.containerOf(n,fromLoc); if(!from) return;
      const [it]=from.splice(fromIdx,1);
      const to=this.containerOf(n,toLoc); if(!to){ from.splice(fromIdx,0,it); return; }
      let i = (toIdx==null) ? to.length : toIdx;
      if(this.sameLoc(fromLoc,toLoc) && fromIdx<i) i--;
      to.splice(i,0,it);
    });
  }
  moveItemBy(loc, idx, dir){
    this.update(n=>{
      const c=this.containerOf(n,loc); if(!c) return;
      const j=idx+dir; if(j<0||j>=c.length) return;
      const [it]=c.splice(idx,1); c.splice(j,0,it);
    });
  }
  moveItemIntoFolder(fromLoc, fromIdx, sectionId, folderId){
    this.update(n=>{
      const from=this.containerOf(n,fromLoc); if(!from) return;
      const it = from[fromIdx]; if(!it || it.id===folderId || it.type==='folder') return;
      from.splice(fromIdx,1);
      const sec=n.find(s=>s.id===sectionId); const f=sec&&sec.items.find(x=>x.id===folderId);
      if(f) f.items.push(it); else from.splice(fromIdx,0,it);
    });
  }
  moveItemOutOfFolder(fromLoc, fromIdx){
    if(!fromLoc.folderId) return;
    this.update(n=>{
      const from=this.containerOf(n,fromLoc); if(!from) return;
      const it = from[fromIdx]; if(!it) return;
      from.splice(fromIdx,1);
      const sec=n.find(s=>s.id===fromLoc.sectionId);
      if(sec) sec.items.push(it); else from.splice(fromIdx,0,it);
    });
  }

  openItem(item, loc){
    if(item.type==='link' || item.type==='poster'){ if(item.url) window.open(item.url,'_blank','noopener'); else if(item.type==='poster') this.setState({modal:{type:'form',kind:'poster',loc,draft:{...item}}}); }
    else if(item.type==='file'){ if(item.dataUrl) window.open(item.dataUrl,'_blank'); else alert('This is a sample file. Add your own via edit mode to open it.'); }
    else if(item.type==='note'){ this.setState({modal:{type:'note-view', item}}); }
    else if(item.type==='folder'){ this.setState({modal:{type:'folder-view', sectionId:loc.sectionId, folderId:item.id}}); }
  }

  // =================== RENDER ===================
  render(){
    const liveSecs = this.state.sections.filter(s=>!s.archived);
    const total = liveSecs.reduce((a,s)=>a+s.items.filter(it=>!it.archived).length,0);
    const countLabel = liveSecs.length+' sections · '+total+' bookmarks';
    const themeIcon = this.state.theme==='dark' ? '☀' : '☾';
    const groups = this.state.viewMode==='groups';
    const edit = this.state.edit;
    const addButtonLabel = groups ? '+ New group' : '+ New section';
    const iconBtnStyle = (on)=>({width:'38px',height:'38px',borderRadius:'10px',border:'1px solid '+(on?'transparent':'var(--border)'),background:on?'var(--accent)':'transparent',color:on?'#211B12':'var(--muted)',cursor:'pointer',lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center'});
    const pencilIcon = h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}, h('path',{d:'M12 20h9'}), h('path',{d:'M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z'}));
    const archiveIcon = h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}, h('rect',{x:3,y:4,width:18,height:4,rx:1}), h('path',{d:'M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8'}), h('line',{x1:10,y1:12,x2:14,y2:12}));
    return h('div',{style:{minHeight:'100vh',background:'radial-gradient(1200px 600px at 80% -10%, var(--glow), transparent 60%), var(--bg)'}},
      h('header',{style:{position:'sticky',top:0,zIndex:40,backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',background:'var(--header-bg)',borderBottom:'1px solid var(--border)'}},
        h('div',{style:{maxWidth:'1320px',margin:'0 auto',padding:'18px 28px',display:'flex',alignItems:'center',gap:'20px',flexWrap:'wrap'}},
          h('div',{style:{display:'flex',alignItems:'center',gap:'12px',flex:'none'}},
            h('div',{style:{width:'34px',height:'34px',borderRadius:'9px',background:'linear-gradient(140deg,#D8A24A,#b9803a)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Space Grotesk'",fontWeight:700,color:'#1A1815',fontSize:'18px'}},'B'),
            h('div',{},
              h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'19px',letterSpacing:'-.01em',lineHeight:1}},'Bookmarks'),
              h('div',{style:{fontSize:'11.5px',color:'var(--muted)',marginTop:'3px'}}, countLabel))),
          h('div',{style:{flex:1,minWidth:'200px',display:'flex',justifyContent:'center'}},
            h('div',{style:{position:'relative',width:'100%',maxWidth:'440px'}},
              h('span',{style:{position:'absolute',left:'13px',top:'50%',transform:'translateY(-50%)',color:'var(--muted)',display:'flex'}},
                h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
                  h('circle',{cx:11,cy:11,r:7}), h('line',{x1:21,y1:21,x2:16.65,y2:16.65}))),

        )),

  renderViewSwitchIcon(){
    const s = 18;
    const stroke = { width:s, height:s, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' };

      h('line',{x1:3,y1:20,x2:14,y2:20})

  }

  renderGroupsArea(){
    if(this.state.groupOpen) return this.renderGroupDetail(this.state.groupOpen);
    return this.renderGroupsGrid();
  }

  renderGroupsGrid(){
    const q = this.state.query.trim().toLowerCase();
    const secs = this.state.sections;
    if(secs.length===0) return this.emptyState();
    const visible = secs.filter(s=> !s.archived && (!q || s.title.toLowerCase().includes(q) || s.items.some(it=>this.matches(it,q))));
    if(q && visible.length===0) return h('div',{style:{textAlign:'center',padding:'80px 0',color:C.muted}}, 'No groups match “'+this.state.query+'”.');
    return h('div',{style:{paddingTop:'0'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px'}},
        h('h2',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'21px',margin:0,letterSpacing:'-.015em'}}, 'Groups'),
        h('span',{style:{fontSize:'12.5px',color:C.faint,background:C.chip,borderRadius:'20px',padding:'3px 10px'}}, visible.length)),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(174px, 1fr))',gridAutoRows:'120px',gap:'18px'}},
        visible.map(s=> this.renderGroupCard(s)),
        h('button',{key:'add-group','data-add':true,onClick:()=>this.addSection(),
          style:{gridRow:'span 2',borderRadius:'14px',border:'1.5px dashed '+C.dash,background:'transparent',color:C.faint,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'6px',transition:'all .15s'}},
          h('span',{style:{fontSize:'26px',lineHeight:1}},'+'),
          h('span',{style:{fontSize:'12.5px',fontWeight:500}},'New group')
        )
      )
    );
  }

  miniIcon(it, size){
    const fav = it && it.type==='link' ? (it.icon || faviconOf(it.url)) : '';
    const img = it && it.type==='poster' && it.image ? it.image : '';
    return h('div',{key:it?it.id:Math.random(),style:{width:'100%',height:'100%',borderRadius:size+'px',background:C.chip,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',fontSize:(size*2.4)+'px',fontWeight:700,color:C.accentInk}},
      img ? h('img',{src:img,style:{width:'100%',height:'100%',objectFit:'cover'},onError:(e)=>{ e.target.style.display='none'; }})
        : fav ? h('img',{src:fav,width:size*4,height:size*4,style:{borderRadius:(size*0.5)+'px'},onError:(e)=>{ e.target.style.display='none'; }})
        : (it?(it.title||it.name||'?'):'?')[0].toUpperCase()
    );
  }

  renderGroupCard(section){
    const items = section.items.filter(it=>!it.archived);
    const rest = items.slice(3,7);
    const cells = [];
    for(let i=0;i<3;i++){
      cells.push(items[i] ? h('div',{key:'c'+i,style:{aspectRatio:'1'}}, this.miniIcon(items[i],7)) : h('div',{key:'c'+i,style:{aspectRatio:'1',borderRadius:'7px',background:C.chip}}));
    }
    if(items.length<=4){
      cells.push(items[3] ? h('div',{key:'c3',style:{aspectRatio:'1'}}, this.miniIcon(items[3],7)) : h('div',{key:'c3',style:{aspectRatio:'1',borderRadius:'7px',background:C.chip}}));
    } else {
      cells.push(h('div',{key:'c3',style:{aspectRatio:'1',display:'grid',gridTemplateColumns:'1fr 1fr',gridTemplateRows:'1fr 1fr',gap:'3px'}},
        [0,1,2,3].map(j=> rest[j]
          ? h('div',{key:'r'+j,style:{borderRadius:'3px',overflow:'hidden'}}, this.miniIcon(rest[j],3))
          : h('div',{key:'r'+j,style:{borderRadius:'3px',background:C.border}}))
      ));
    }
    return h('div',{key:section.id,'data-card':true,onClick:(e)=>{ if(e.target.closest('[data-del]')) return; this.openGroup(section.id); },
      style:{cursor:'pointer',position:'relative',gridRow:'span 2',borderRadius:'14px',border:'1px solid '+C.border,background:C.surface,overflow:'hidden',display:'flex',flexDirection:'column'}},
      h('div',{style:{flex:'1 1 auto',minHeight:0,padding:'14px 14px 6px',display:'flex',alignItems:'center',justifyContent:'center'}},
        h('div',{style:{width:'100%',aspectRatio:'1',display:'grid',gridTemplateColumns:'1fr 1fr',gridTemplateRows:'1fr 1fr',gap:'6px'}}, cells)
      ),
      h('div',{style:{padding:'0 15px 15px'}},
        h('div',{style:{fontWeight:600,fontSize:'14px',lineHeight:1.25,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, section.title),
        h('div',{style:{fontSize:'11.5px',color:C.faint,marginTop:'3px'}}, items.length+' item'+(items.length===1?'':'s'))
      ),
      this.state.edit ? h('div',{style:{position:'absolute',top:'7px',right:'7px',display:'flex',gap:'3px',zIndex:3}},
        h('button',{'data-del':true,'data-btn':true,title:'Archive group',onClick:(e)=>{ e.stopPropagation(); this.archiveSection(section.id); },
          style:{width:'24px',height:'24px',borderRadius:'7px',border:'none',background:'rgba(20,18,15,.78)',color:'#EDE9E0',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}}, IC.archive(14)),
        h('button',{'data-del':true,'data-btn':true,title:'Delete group',onClick:(e)=>{ e.stopPropagation(); this.deleteSection(section.id); },
          style:{width:'24px',height:'24px',borderRadius:'7px',border:'none',background:'rgba(20,18,15,.78)',color:'#e6a0a0',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}}, IC.x(14))
      ) : null
    );
  }

  renderGroupDetail(sectionId){
    const section = this.state.sections.find(s=>s.id===sectionId);
    if(!section){ return h('div',{style:{textAlign:'center',padding:'60px 0',color:C.muted}},
      h('div',{},'Group not found'),
      h('button',{'data-ghost':true,onClick:()=>this.closeGroup(),style:{marginTop:'14px',background:'transparent',border:'1px solid '+C.border,color:C.muted,borderRadius:'10px',padding:'9px 16px',cursor:'pointer'}},'← Back to groups')
    ); }
    const q = this.state.query.trim().toLowerCase();
    const items = section.items.filter(it=> !it.archived && (!q || this.matches(it,q)));
    const loc = {sectionId:section.id};
    const edit = this.state.edit;
    return h('div',{},
      h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'22px'}},
        h('button',{'data-btn':true,onClick:()=>this.closeGroup(),title:'Back to groups',
          style:{display:'flex',alignItems:'center',gap:'6px',border:'1px solid '+C.border,background:'transparent',color:C.muted,borderRadius:'9px',padding:'8px 13px',cursor:'pointer',fontSize:'13px'}}, '←  Groups'),
        h('h2',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'22px',margin:0}}, section.title),
        h('span',{style:{fontSize:'12.5px',color:C.faint,background:C.chip,borderRadius:'20px',padding:'3px 10px'}}, section.items.filter(it=>!it.archived).length)
      ),
      q && items.length===0
        ? h('div',{style:{textAlign:'center',padding:'60px 0',color:C.muted}}, 'No bookmarks match “'+this.state.query+'”.')
        : h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(174px, 1fr))',gridAutoRows:'120px',gridAutoFlow:'row dense',gap:'18px'},
            onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='item') e.preventDefault(); }:null,
            onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='item'){ e.preventDefault(); this.moveItem(this._drag.loc,this._drag.index, loc, null); this._drag=null; } }:null,
          },
          items.map((it)=> this.renderCard(it, loc, section.items.indexOf(it))),
          this.addTile(loc)
        )
    );
  }

  renderSidebar(){
    const secs = this.state.sections.filter(s=>!s.archived);
    const edit = this.state.edit;
    return h('aside',{style:{flex:'none',width:'214px',position:'sticky',top:'88px',maxHeight:'calc(100vh - 108px)',overflowY:'auto',paddingTop:'34px'}},
      h('div',{style:{fontSize:'11px',fontWeight:700,letterSpacing:'.09em',textTransform:'uppercase',color:C.faint,padding:'0 12px 10px',display:'flex',alignItems:'center',gap:'6px'}},'Sections',
        edit ? h('span',{style:{fontWeight:500,letterSpacing:0,textTransform:'none',color:C.faint,fontSize:'10px'}},'· drag to reorder') : null),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'2px'}},
        secs.length===0 ? h('div',{style:{fontSize:'12.5px',color:C.faint,padding:'6px 12px'}},'No sections yet')
        : secs.map((s)=>{
          const active = this.state.activeSec===s.id;
          return h('div',{key:s.id,'data-sidesec':true,
            draggable: edit,
            onDragStart: edit?(e)=>{ this._drag={kind:'section-side',id:s.id}; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain','s');}catch(_){} }:null,
            onDragEnd: edit?(e)=>{ this._drag=null; e.currentTarget.classList.remove('bm-dragover'); }:null,
            onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='section-side'){ e.preventDefault(); e.currentTarget.classList.add('bm-dragover'); } }:null,
            onDragLeave: edit?(e)=>{ e.currentTarget.classList.remove('bm-dragover'); }:null,
            onDrop: edit?(e)=>{ e.currentTarget.classList.remove('bm-dragover'); if(this._drag&&this._drag.kind==='section-side'){ e.preventDefault(); this.reorderSections(this._drag.id, s.id); this._drag=null; } }:null,
            style:{display:'flex',alignItems:'center',gap:'2px'}},
            edit ? h('span',{'data-handle':true,title:'Drag to reorder',style:{color:C.faint,display:'flex',alignItems:'center',userSelect:'none',paddingLeft:'2px'}}, IC.grip(15)) : null,
            h('button',{'data-nav':true,onClick:()=>this.scrollToSection(s.id),
              style:{display:'flex',alignItems:'center',gap:'8px',flex:1,minWidth:0,textAlign:'left',background:active?'rgba(216,162,74,.14)':'transparent',border:'none',borderRadius:'9px',padding:'8px 11px',cursor:edit?'grab':'pointer',color:active?C.accentInk:C.muted,fontSize:'13.5px',fontWeight:active?600:500}},
              h('span',{style:{width:'5px',height:'5px',borderRadius:'50%',background:active?C.accent:C.dot,flex:'none'}}),
              h('span',{style:{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, s.title),
              h('span',{style:{fontSize:'11px',color:C.faint,flex:'none'}}, s.items.filter(it=>!it.archived).length))
          );
        })
      ),
      h('button',{'data-nav':true,onClick:()=>this.addSection(),style:{display:'flex',alignItems:'center',gap:'7px',width:'100%',textAlign:'left',background:'transparent',border:'1px dashed '+C.border,borderRadius:'9px',padding:'8px 12px',cursor:'pointer',color:C.faint,fontSize:'13px',marginTop:'10px'}},'+ New section')
    );
  }

  renderBanner(){
    return h('div',{key:'bn',style:{position:'fixed',bottom:'22px',left:'50%',transform:'translateX(-50%)',zIndex:60,background:'#2b2620',border:'1px solid '+C.border,borderRadius:'12px',padding:'10px 18px',display:'flex',alignItems:'center',gap:'12px',boxShadow:'0 14px 40px -12px rgba(0,0,0,.7)',animation:'bm-pop .2s ease both',fontSize:'13px'}},
      h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:C.accent,boxShadow:'0 0 10px '+C.accent}}),
      h('span',{style:{color:'#EDE9E0',fontWeight:600}},'Edit mode'),
      h('span',{style:{color:'#9a9484'}},'Drag to reorder · click a card to edit · archive or delete from the card')
    );
  }

  matches(item, q){
    if(!q) return true;
    const hay = [item.title,item.name,item.text,item.fileName,domainOf(item.url)].filter(Boolean).join(' ').toLowerCase();
    if(hay.includes(q)) return true;
    if(item.type==='folder' && item.items) return item.items.some(c=>this.matches(c,q));
    return false;
  }

  renderBoard(){
    const q = this.state.query.trim().toLowerCase();
    const secs = this.state.sections;
    if(secs.length===0) return this.emptyState();
    const visible = secs.map((s,i)=>({s,i})).filter(({s})=> !s.archived && (!q || s.title.toLowerCase().includes(q) || s.items.some(it=>this.matches(it,q))) );
    if(q && visible.length===0) return h('div',{style:{textAlign:'center',padding:'80px 0',color:C.muted}}, 'No bookmarks match “'+this.state.query+'”.');
    return h('div',{style:{display:'flex',flexDirection:'column',gap:'42px'}},
      visible.map(({s,i})=> this.renderSection(s,i,q)) );
  }

  emptyState(){
    return h('div',{style:{textAlign:'center',padding:'90px 20px',animation:'bm-fade .3s ease'}},
      h('div',{style:{fontSize:'40px',marginBottom:'8px',opacity:.6}},'🔖'),
      h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'22px',marginBottom:'8px'}},'No sections yet'),
      h('div',{style:{color:C.muted,marginBottom:'22px'}},'Create a section to start grouping your links, shows, files and notes.'),
      h('button',{'data-pri':true,onClick:()=>this.addSection(),style:{background:C.accent,color:C.onAccent,border:'none',borderRadius:'10px',padding:'12px 22px',fontWeight:600,fontSize:'14px',cursor:'pointer'}},'+ Create your first section')
    );
  }

  renderSection(section, sIdx, q){
    const edit = this.state.edit;
    const renaming = this.state.renaming===section.id;
    const collapsed = !!section.collapsed;
    const items = section.items.filter(it=> !it.archived && (!section.title.toLowerCase().includes(q) ? this.matches(it,q) : true));
    const liveCount = section.items.filter(it=>!it.archived).length;
    const dragHi = this.state.dragOverSec===section.id;
    const collapseBtn = h('button',{'data-btn':true, key:'col', title: collapsed?'Show section':'Hide section', onClick:(e)=>{ e.stopPropagation(); this.toggleCollapse(section.id); },
      style:{width:'30px',height:'30px',borderRadius:'8px',border:'1px solid '+C.border,background:'transparent',color:C.muted,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}, collapsed?IC.right(16):IC.down(16));

    const header = h('div',{'data-sechdr':true,
        style:{display:'flex',alignItems:'center',gap:'10px',marginBottom: collapsed?'0':'16px',paddingTop:'6px',borderTop: dragHi?'2px solid '+C.accent:'2px solid transparent',transition:'border-color .15s'},
        onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='section'){ e.preventDefault(); if(this.state.dragOverSec!==section.id) this.setState({dragOverSec:section.id}); } }:null,
        onDragLeave: edit?()=>{ if(this.state.dragOverSec===section.id) this.setState({dragOverSec:null}); }:null,
        onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='section'){ e.preventDefault(); this.moveSectionTo(this._drag.index, sIdx); this._drag=null; this.setState({dragOverSec:null}); } }:null,
      },
      edit ? h('span',{'data-handle':true,draggable:true,
        onDragStart:(e)=>{ this._drag={kind:'section',index:sIdx}; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain','s');}catch(_){} },
        onDragEnd:()=>{ this._drag=null; this.setState({dragOverSec:null}); },
        title:'Drag to reorder section',
        style:{color:C.faint,display:'flex',alignItems:'center',userSelect:'none'}}, IC.grip(18)) : null,
      renaming
        ? h('input',{autoFocus:true,defaultValue:section.title,'data-inp':true,
            onBlur:(e)=>{ this.renameSection(section.id, e.target.value.trim()||'Untitled'); this.setState({renaming:null}); },
            onKeyDown:(e)=>{ if(e.key==='Enter') e.target.blur(); if(e.key==='Escape') this.setState({renaming:null}); },
            style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'21px',background:C.inputBg,border:'1px solid '+C.border,borderRadius:'8px',padding:'4px 10px'}})
        : h('h2',{'data-secname':true,title:'Click to rename',onClick:()=>this.setState({renaming:section.id}),
            style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'21px',margin:0,letterSpacing:'-.015em',cursor:'text',padding:'4px 8px',marginLeft:'-8px',borderRadius:'8px'}}, section.title),
      h('span',{style:{fontSize:'12.5px',color:C.faint,background:C.chip,borderRadius:'20px',padding:'3px 10px'}}, liveCount),
      h('div',{style:{flex:1}}),
      (!edit && !renaming) ? h('div',{'data-hoveredit':true,style:{display:'flex',gap:'4px'}},
        collapseBtn
      ) : null,
      edit ? h('div',{style:{display:'flex',gap:'4px'}},
        collapseBtn,
        this.iconBtn(IC.archive(15),'Archive section', ()=>this.archiveSection(section.id)),
        this.iconBtn(IC.x(15),'Delete section', ()=>this.deleteSection(section.id), true),
      ) : null
    );

    const loc = {sectionId:section.id};
    const grid = collapsed ? null : h('div',{
        style:{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(174px, 1fr))',gridAutoRows:'120px',gridAutoFlow:'row dense',gap:'18px'},
        onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='item') e.preventDefault(); }:null,
        onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='item'){ e.preventDefault(); this.moveItem(this._drag.loc,this._drag.index, loc, null); this._drag=null; } }:null,
      },
      items.map((it)=> this.renderCard(it, loc, section.items.indexOf(it))),
      this.addTile(loc)
    );

    return h('section',{key:section.id, id:'bm-sec-'+section.id, style:{animation:'bm-fade .25s ease',scrollMarginTop:'84px'}}, header, grid);
  }

  iconBtn(glyph,title,onClick,danger){
    return h('button',{'data-btn':true,disabled:!onClick,title,onClick:onClick||undefined,
      style:{width:'30px',height:'30px',borderRadius:'8px',border:'1px solid '+C.border,background:'transparent',color:onClick?(danger?'#d98a8a':C.muted):C.faint,cursor:onClick?'pointer':'default',fontSize:'13px',display:'flex',alignItems:'center',justifyContent:'center',opacity:onClick?1:.4}}, glyph);
  }

  addTile(loc){
    return h('button',{key:'add','data-add':true,onClick:()=>this.setState({modal:{type:'pick',loc}}),
      style:{gridRow:'span 1',borderRadius:'14px',border:'1.5px dashed '+C.dash,background:'transparent',color:C.faint,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'4px',transition:'all .15s',minHeight:'120px'}},
      h('span',{style:{fontSize:'22px',lineHeight:1}},'+'),
      h('span',{style:{fontSize:'12px',fontWeight:500}},'Add')
    );
  }

  cardShell(item, loc, idx, inner, opts){
    opts = opts||{};
    const edit = this.state.edit;
    const cont = this.containerOf(this.state.sections, loc) || [];
    const atStart = idx<=0, atEnd = idx>=cont.length-1;
    const mvBtn = (glyph,title,disabled,fn)=> h('button',{'data-mv':true,'data-del':true,disabled,title,onClick:(e)=>{ e.stopPropagation(); if(!disabled) fn(); },
      style:{width:'22px',height:'22px',borderRadius:'6px',border:'none',background:'rgba(20,18,15,.78)',color:disabled?C.faint:'#EDE9E0',cursor:disabled?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)',opacity:disabled?.4:1}}, glyph);
    const cornerBtn = (icon,title,color,fn)=> h('button',{'data-del':true,'data-btn':true,title,onClick:(e)=>{ e.stopPropagation(); fn(); },
      style:{width:'24px',height:'24px',borderRadius:'7px',border:'none',background:'rgba(20,18,15,.78)',color:color||'#EDE9E0',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}}, icon);
    return h('div',{key:item.id,'data-card':true,
      draggable: edit,
      onDragStart: edit?(e)=>{ this._drag={kind:'item',loc,index:idx}; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain','i');}catch(_){} }:null,
      onDragEnd: edit?()=>{ this._drag=null; }:null,
      onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='item') e.preventDefault(); }:null,
      onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='item'){ e.preventDefault(); e.stopPropagation(); if(opts.onDrop){ opts.onDrop(this._drag); } else { this.moveItem(this._drag.loc,this._drag.index, loc, idx); } this._drag=null; } }:null,
      onClick:(e)=>{ if(e.target.closest('[data-del]')) return; if(edit) this.openForm(item, loc); else this.openItem(item, loc); },
      style:Object.assign({position:'relative',borderRadius:'14px',border:'1px solid '+C.border,background:opts.bg||C.surface,cursor:'pointer',overflow:'hidden',gridRow:opts.tall?'span 2':'span 1',display:'flex',flexDirection:'column'}, opts.style||{})
    },
      inner,
      edit ? h('div',{style:{position:'absolute',top:'7px',left:'7px',display:'flex',gap:'3px',zIndex:3}},
        mvBtn(IC.left(),'Move back', atStart, ()=>this.moveItemBy(loc,idx,-1)),
        mvBtn(IC.right(),'Move forward', atEnd, ()=>this.moveItemBy(loc,idx,1)),
        loc.folderId ? mvBtn(IC.out(),'Move out of folder', false, ()=>this.moveItemOutOfFolder(loc,idx)) : null
      ) : null,
      edit ? h('div',{style:{position:'absolute',top:'7px',right:'7px',display:'flex',gap:'3px',zIndex:3}},
        cornerBtn(IC.archive(),'Archive','#EDE9E0',()=>this.archiveItem(loc,item.id)),
        cornerBtn(IC.x(),'Delete','#e6a0a0',()=>this.deleteItem(loc,item.id))
      ) : h('button',{'data-del':true,'data-hoveredit':true,title:'More options','aria-label':'More options',
        onClick:(e)=>{ e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect(); this.setState({menu:{item,loc,x:r.right,y:r.bottom+4}}); },
        style:{position:'absolute',top:'7px',right:'7px',width:'24px',height:'24px',borderRadius:'7px',border:'none',background:'rgba(20,18,15,.78)',color:'#EDE9E0',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)',zIndex:3}}, IC.more(15))
    );
  }

  renderCard(item, loc, idx){
    if(item.type==='poster') return this.posterCard(item, loc, idx);
    if(item.type==='link') return this.linkCard(item, loc, idx);
    if(item.type==='file') return this.fileCard(item, loc, idx);
    if(item.type==='note') return this.noteCard(item, loc, idx);
    if(item.type==='folder') return this.folderCard(item, loc, idx);
    return null;
  }

  linkCard(item, loc, idx){
    const dom = domainOf(item.url);
    const fav = item.icon || faviconOf(item.url);
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'10px'}},
      h('div',{style:{width:'44px',height:'44px',borderRadius:'11px',background:C.chip,display:'flex',alignItems:'center',justifyContent:'center',flex:'none',overflow:'hidden',fontSize:'18px'}},
        fav ? h('img',{src:fav,width:26,height:26,style:{borderRadius:'5px'},onError:(e)=>{ e.target.style.display='none'; e.target.parentNode.textContent=(item.title||'?')[0].toUpperCase(); e.target.parentNode.style.fontWeight='700'; e.target.parentNode.style.color='var(--accent-ink)'; }})
           : h('span',{style:{fontWeight:700,color:C.accentInk}}, (item.title||'?')[0].toUpperCase())),
      h('div',{style:{marginTop:'auto'}},
        h('div',{style:{fontWeight:600,fontSize:'14px',lineHeight:1.25,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}, item.title||dom||'Untitled'),
        h('div',{style:{fontSize:'11.5px',color:C.faint,marginTop:'3px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, dom||'—'))
    );
    return this.cardShell(item, loc, idx, inner);
  }

  posterCard(item, loc, idx){
    const hue = hashNum(item.title)%360;
    const inner = h('div',{style:{position:'relative',width:'100%',height:'100%'}},
      item.image
        ? h('img',{src:item.image,alt:item.title,style:{width:'100%',height:'100%',objectFit:'cover',display:'block'},onError:(e)=>{ e.target.style.display='none'; }})
        : h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(150deg, hsl('+hue+' 42% 30%), hsl('+((hue+40)%360)+' 38% 18%))',display:'flex',alignItems:'center',justifyContent:'center'}},
            h('span',{style:{fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:'30px',color:'rgba(255,255,255,.22)'}}, (item.title||'?').slice(0,2).toUpperCase())),
      h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(10,9,7,.92) 8%, rgba(10,9,7,.2) 45%, transparent 70%)'}}),
      h('div',{style:{position:'absolute',left:0,right:0,bottom:0,padding:'12px'}},
        h('div',{style:{fontWeight:600,fontSize:'13.5px',lineHeight:1.25,textShadow:'0 1px 6px rgba(0,0,0,.6)',overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}, item.title),
        item.url ? h('div',{style:{fontSize:'10.5px',color:'rgba(255,255,255,.6)',marginTop:'3px'}}, '↗ '+domainOf(item.url)) : null)
    );
    return this.cardShell(item, loc, idx, inner, {tall:true, bg:'#111'});
  }

  fileCard(item, loc, idx){
    const ext = extOf(item.fileName);
    const col = chipColor(ext);
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'10px'}},
      h('div',{style:{width:'40px',height:'46px',borderRadius:'7px',background:col,position:'relative',flex:'none',boxShadow:'0 4px 10px -4px '+col,display:'flex',alignItems:'flex-end',padding:'5px'}},
        h('span',{style:{position:'absolute',top:0,right:0,width:'13px',height:'13px',background:'rgba(255,255,255,.32)',borderBottomLeftRadius:'5px'}}),
        h('span',{style:{fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:'9.5px',color:'rgba(255,255,255,.95)',letterSpacing:'.02em'}}, ext)),
      h('div',{style:{marginTop:'auto'}},
        h('div',{style:{fontWeight:600,fontSize:'13.5px',lineHeight:1.25,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}, item.title||item.fileName),
        h('div',{style:{fontSize:'11px',color:C.faint,marginTop:'3px'}}, [fmtSize(item.size), item.dataUrl?'':'sample'].filter(Boolean).join(' · ')))
    );
    return this.cardShell(item, loc, idx, inner);
  }

  noteCard(item, loc, idx){
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'7px'}},
      h('div',{style:{fontWeight:600,fontSize:'13.5px',display:'flex',alignItems:'center',gap:'6px'}},
        h('span',{style:{color:C.accentInk,fontSize:'12px'}},'❝'), item.title||'Note'),
      h('div',{style:{fontSize:'12px',color:C.muted,lineHeight:1.5,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',whiteSpace:'pre-wrap'}}, item.text||'')
    );
    return this.cardShell(item, loc, idx, inner, {bg:'rgba(216,162,74,.07)', style:{border:'1px solid rgba(216,162,74,.22)'}});
  }

  folderCard(item, loc, idx){
    const edit = this.state.edit;
    const inner = h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%',gap:'10px'}},
      h('div',{style:{width:'42px',height:'34px',position:'relative',flex:'none'}},
        h('div',{style:{position:'absolute',inset:'4px 0 0 0',background:C.chip,borderRadius:'6px'}}),
        h('div',{style:{position:'absolute',inset:'0 6px 4px 6px',top:'6px',background:'rgba(216,162,74,.85)',borderRadius:'6px'}}),
        h('div',{style:{position:'absolute',left:0,top:0,width:'18px',height:'9px',background:'rgba(216,162,74,.85)',borderRadius:'5px 5px 0 0'}})),
      h('div',{style:{marginTop:'auto'}},
        h('div',{style:{fontWeight:600,fontSize:'13.5px',lineHeight:1.25}}, item.name||'Folder'),
        h('div',{style:{fontSize:'11px',color:C.faint,marginTop:'3px'}}, (item.items?item.items.length:0)+' items'))
    );
    return this.cardShell(item, loc, idx, inner, {bg:C.surface,
      onDrop: (drag)=>{ if(!this.sameLoc(drag.loc,loc) || drag.index!==idx) this.moveItemIntoFolder(drag.loc, drag.index, loc.sectionId, item.id); }
    });
  }

  openForm(item, loc){
    if(item.type==='note') this.setState({modal:{type:'form',kind:'note',loc,draft:{...item}}});
    else if(item.type==='folder') this.setState({modal:{type:'form',kind:'folder',loc,draft:{...item}}});
    else this.setState({modal:{type:'form',kind:item.type,loc,draft:{...item}}});
  }

  // =================== MODALS ===================
  closeModal(){ this.setState({modal:null}); }
  renderModal(){
    const m = this.state.modal; if(!m) return null;
    let body;
    if(m.type==='pick') body=this.pickBody(m);
    else if(m.type==='form') body=this.formBody(m);
    else if(m.type==='note-view') body=this.noteViewBody(m);
    else if(m.type==='folder-view') body=this.folderViewBody(m);
    else if(m.type==='archive') body=this.archiveBody(m);
    const wide = m.type==='folder-view' || m.type==='archive';
    return h('div',{key:'overlay',onClick:(e)=>{ if(e.target===e.currentTarget) this.closeModal(); },
      style:{position:'fixed',inset:0,zIndex:80,background:'rgba(10,9,7,.6)',backdropFilter:'blur(6px)',WebkitBackdropFilter:'blur(6px)',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'8vh 20px 40px',overflowY:'auto',animation:'bm-fade .15s ease'}},
      h('div',{style:{width:'100%',maxWidth: wide?'920px':'460px',background:C.modalBg,border:'1px solid '+C.border,borderRadius:'18px',boxShadow:'0 30px 80px -20px rgba(0,0,0,.8)',animation:'bm-pop .2s cubic-bezier(.2,.7,.3,1) both',overflow:'hidden'}}, body)
    );
  }

  pickBody(m){
    const opts=[
      ['link','Link','Website or web app','#4079C2'],
      ['poster','Show / Movie','2:3 poster card','#C2466A'],
      ['file','File','From your device','#3F9E72'],
      ['note','Note','Plain text reminder','#C2A340'],
      ['folder','Folder','Group items together','#9466C2'],
    ];
    return h('div',{style:{padding:'22px'}},
      this.modalHead('Add bookmark'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginTop:'4px'}},
        opts.map(([k,label,desc,col])=> h('button',{key:k,'data-pick':true,onClick:()=>this.setState({modal:{type:'form',kind:k,loc:m.loc,draft:this.blankDraft(k)}}),
          style:{textAlign:'left',background:C.chip,border:'1px solid '+C.border,borderRadius:'12px',padding:'14px',cursor:'pointer',display:'flex',gap:'12px',alignItems:'center',transition:'all .15s'}},
          h('span',{style:{width:'30px',height:'30px',borderRadius:'8px',background:col,flex:'none'}}),
          h('span',{},
            h('div',{style:{fontWeight:600,fontSize:'14px'}},label),
            h('div',{style:{fontSize:'11.5px',color:C.muted,marginTop:'2px'}},desc)))
        ))
    );
  }
  blankDraft(k){
    const id=uid();
    if(k==='link') return {id,type:'link',title:'',url:'',icon:''};
    if(k==='poster') return {id,type:'poster',title:'',image:'',url:''};
    if(k==='file') return {id,type:'file',title:'',fileName:'',size:0,mime:'',dataUrl:''};
    if(k==='note') return {id,type:'note',title:'',text:''};
    if(k==='folder') return {id,type:'folder',name:'',items:[]};
  }

  field(label, node){
    return h('label',{style:{display:'block',marginBottom:'14px'}},
      h('div',{style:{fontSize:'12px',fontWeight:600,color:C.muted,marginBottom:'6px'}},label), node);
  }
  inp(val, onChange, ph, type){
    return h('input',{'data-inp':true,type:type||'text',value:val||'',placeholder:ph||'',onChange:(e)=>onChange(e.target.value),
      style:{width:'100%',background:C.inputBg,border:'1px solid '+C.border,borderRadius:'10px',padding:'10px 12px',fontSize:'14px'}});
  }

  formBody(m){
    const d = m.draft; const k = m.kind;
    const set = (patch)=> this.setState({modal:{...m, draft:{...m.draft,...patch}}});
    const isEdit = !!this.containerOf(this.state.sections, m.loc)?.find(x=>x.id===d.id);
    const titles = {link:'Link', poster:'Show / Movie', file:'File', note:'Note', folder:'Folder'};
    let fields=[];
    if(k==='link'){
      fields=[ this.field('Title', this.inp(d.title,(v)=>set({title:v}),'e.g. GitHub')),
        this.field('URL', this.inp(d.url,(v)=>set({url:v}),'https://…')),
        this.field('Icon URL', this.inp(d.icon,(v)=>set({icon:v}),'https://…  (optional — defaults to site favicon)')),
        d.icon ? h('div',{style:{marginBottom:'14px'}}, h('img',{src:d.icon,style:{width:'40px',height:'40px',objectFit:'contain',borderRadius:'8px',border:'1px solid '+C.border,background:C.chip},onError:(e)=>{e.target.style.opacity='.3';}})) : null ];
    } else if(k==='poster'){
      fields=[ this.field('Title', this.inp(d.title,(v)=>set({title:v}),'e.g. Severance')),
        this.field('Poster image URL', this.inp(d.image,(v)=>set({image:v}),'https://…  (optional)')),
        this.field('Link URL', this.inp(d.url,(v)=>set({url:v}),'where it plays (optional)')),
        d.image ? h('div',{style:{marginBottom:'14px'}}, h('img',{src:d.image,style:{width:'90px',aspectRatio:'2/3',objectFit:'cover',borderRadius:'8px',border:'1px solid '+C.border},onError:(e)=>{e.target.style.opacity='.3';}})) : null ];
    } else if(k==='file'){
      fields=[
        h('div',{style:{marginBottom:'14px'}},
          h('div',{style:{fontSize:'12px',fontWeight:600,color:C.muted,marginBottom:'6px'}},'File'),
          h('label',{'data-add':true,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',border:'1.5px dashed '+C.dash,borderRadius:'12px',padding:'22px',cursor:'pointer',transition:'all .15s'}},
            h('span',{style:{fontSize:'22px'}},'⬆'),
            h('span',{style:{fontSize:'13px',color:C.muted}}, d.fileName? (d.fileName+'  ·  '+fmtSize(d.size)) : 'Choose a file from your device'),
            h('input',{type:'file',style:{display:'none'},onChange:(e)=>this.onFile(e,m)}))),
        this.field('Display name', this.inp(d.title,(v)=>set({title:v}),'optional — defaults to file name')),
      ];
    } else if(k==='note'){
      fields=[ this.field('Title', this.inp(d.title,(v)=>set({title:v}),'optional')),
        this.field('Text', h('textarea',{'data-inp':true,value:d.text||'',onChange:(e)=>set({text:e.target.value}),placeholder:'Write anything…',
          style:{width:'100%',minHeight:'120px',resize:'vertical',background:C.inputBg,border:'1px solid '+C.border,borderRadius:'10px',padding:'10px 12px',fontSize:'14px',lineHeight:1.5}})) ];
    } else if(k==='folder'){
      fields=[ this.field('Folder name', this.inp(d.name,(v)=>set({name:v}),'e.g. Articles')) ];
    }
    const canSave = (k==='folder' ? (d.name||'').trim() : k==='note' ? ((d.text||'').trim()||(d.title||'').trim()) : k==='file' ? (d.fileName||d.title) : (d.title||'').trim()||(d.url||'').trim());
    return h('div',{style:{padding:'22px'}},
      this.modalHead((isEdit?'Edit ':'Add ')+titles[k]),
      h('div',{}, fields),
      h('div',{style:{display:'flex',gap:'10px',justifyContent:'flex-end',marginTop:'8px'}},
        h('button',{'data-ghost':true,onClick:()=>this.closeModal(),style:{background:'transparent',border:'1px solid '+C.border,color:C.muted,borderRadius:'10px',padding:'10px 18px',fontWeight:600,fontSize:'13.5px',cursor:'pointer'}},'Cancel'),
        h('button',{'data-pri':true,disabled:!canSave,onClick:()=>{ this.saveItem(m.loc, d); this.closeModal(); },
          style:{background:canSave?C.accent:'rgba(216,162,74,.3)',color:C.onAccent,border:'none',borderRadius:'10px',padding:'10px 20px',fontWeight:600,fontSize:'13.5px',cursor:canSave?'pointer':'default'}}, isEdit?'Save':'Add'))
    );
  }
  onFile(e, m){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const set = (patch)=> this.setState(st=> st.modal ? {modal:{...st.modal, draft:{...st.modal.draft,...patch}}} : {});
    set({fileName:f.name, size:f.size, mime:f.type, title:m.draft.title||f.name.replace(/\.[^.]+$/,'')});
    const r = new FileReader();
    r.onload = ()=> set({dataUrl: r.result});
    if(f.size <= 3.5*1048576) r.readAsDataURL(f);
    else { set({dataUrl:''}); /* too large to persist */ }
  }

  modalHead(title){
    return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'18px'}},
      h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'18px'}}, title),
      h('button',{'data-btn':true,onClick:()=>this.closeModal(),style:{width:'30px',height:'30px',borderRadius:'8px',border:'1px solid '+C.border,background:'transparent',color:C.muted,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}, IC.x(15)));
  }

  noteViewBody(m){
    const it=m.item;
    return h('div',{style:{padding:'24px'}},
      this.modalHead(it.title||'Note'),
      h('div',{style:{fontSize:'15px',lineHeight:1.6,color:C.text,whiteSpace:'pre-wrap'}}, it.text||'')
    );
  }

  archiveRow(key, title, sub, onRestore, onDelete){
    const pill = (label,color,fn)=> h('button',{'data-ghost':true,onClick:fn,style:{border:'1px solid '+C.border,background:'transparent',color:color||C.muted,borderRadius:'8px',padding:'6px 12px',fontSize:'12.5px',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}, label);
    return h('div',{key,style:{display:'flex',alignItems:'center',gap:'10px',padding:'11px 12px',border:'1px solid '+C.border,borderRadius:'11px',background:C.chip}},
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{style:{fontWeight:600,fontSize:'13.5px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, title),
        sub ? h('div',{style:{fontSize:'11.5px',color:C.faint,marginTop:'2px'}}, sub) : null),
      pill('Restore', C.accentInk, onRestore),
      pill('Delete', '#d98a8a', onDelete)
    );
  }

  archiveBody(m){
    const secs = this.state.sections;
    const archSecs = secs.filter(s=>s.archived);
    const archItems = [];
    secs.forEach(s=>{
      if(s.archived) return;
      s.items.forEach(it=>{
        if(it.archived) archItems.push({loc:{sectionId:s.id}, item:it, where:s.title});
        if(it.type==='folder' && it.items) it.items.forEach(c=>{ if(c.archived) archItems.push({loc:{sectionId:s.id,folderId:it.id}, item:c, where:s.title+' / '+(it.name||'Folder')}); });
      });
    });
    const nameOf = (it)=> it.title || it.name || it.fileName || (it.type==='note'?'Note':'Untitled');
    const empty = archSecs.length===0 && archItems.length===0;
    return h('div',{style:{padding:'24px'}},
      this.modalHead('Archived'),
      empty ? h('div',{style:{color:C.muted,fontSize:'13.5px',padding:'20px 0',textAlign:'center'}},'Nothing archived. In edit mode, use the ⇩ button on any card or section to archive it.') : null,
      archSecs.length ? h('div',{style:{fontSize:'11px',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:C.faint,margin:'4px 0 8px'}},'Sections') : null,
      archSecs.length ? h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'18px'}},
        archSecs.map(s=> this.archiveRow('s-'+s.id, s.title, s.items.length+' item'+(s.items.length===1?'':'s'),
          ()=>this.archiveSection(s.id,false),
          ()=>this.deleteSection(s.id)))
      ) : null,
      archItems.length ? h('div',{style:{fontSize:'11px',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:C.faint,margin:'4px 0 8px'}},'Bookmarks') : null,
      archItems.length ? h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}},
        archItems.map(a=> this.archiveRow('i-'+a.item.id, nameOf(a.item), a.where+' · '+a.item.type,
          ()=>this.archiveItem(a.loc, a.item.id, false),
          ()=>{ this.deleteItem(a.loc, a.item.id); }))
      ) : null
    );
  }

  folderViewBody(m){
    const sec = this.state.sections.find(s=>s.id===m.sectionId);
    const folder = sec && sec.items.find(i=>i.id===m.folderId);
    if(!folder) return h('div',{style:{padding:'24px'}}, 'Folder not found');
    const loc = {sectionId:m.sectionId, folderId:m.folderId};
    const edit = this.state.edit;
    const grid = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(160px, 1fr))',gridAutoRows:'118px',gridAutoFlow:'row dense',gap:'16px'},
        onDragOver: edit?(e)=>{ if(this._drag&&this._drag.kind==='item') e.preventDefault(); }:null,
        onDrop: edit?(e)=>{ if(this._drag&&this._drag.kind==='item'){ e.preventDefault(); this.moveItem(this._drag.loc,this._drag.index, loc, null); this._drag=null; } }:null },
      folder.items.filter(it=>!it.archived).map((it)=> this.renderCard(it, loc, folder.items.indexOf(it))),
      this.addTile(loc)
    );
    return h('div',{style:{padding:'24px'}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'18px'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
          h('span',{style:{color:C.accent,fontSize:'15px'}},'📁'),
          h('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:600,fontSize:'19px'}}, folder.name),
          h('span',{style:{fontSize:'12px',color:C.faint}}, 'in '+sec.title)),
        h('button',{'data-btn':true,onClick:()=>this.closeModal(),style:{width:'30px',height:'30px',borderRadius:'8px',border:'1px solid '+C.border,background:'transparent',color:C.muted,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}, IC.x(15))),
      folder.items.filter(it=>!it.archived).length===0 && !edit ? h('div',{style:{color:C.muted,fontSize:'13px',marginBottom:'14px'}},'This folder is empty. Turn on Edit mode to add, or drag cards onto the folder.') : null,
      edit ? h('div',{
          onDragOver:(e)=>{ if(this._drag&&this._drag.kind==='item'&&this._drag.loc.folderId===m.folderId){ e.preventDefault(); e.currentTarget.setAttribute('data-drop-on',''); } },
          onDragLeave:(e)=>{ e.currentTarget.removeAttribute('data-drop-on'); },
          onDrop:(e)=>{ e.currentTarget.removeAttribute('data-drop-on'); if(this._drag&&this._drag.kind==='item'&&this._drag.loc.folderId===m.folderId){ e.preventDefault(); this.moveItemOutOfFolder(this._drag.loc, this._drag.index); this._drag=null; } },
          style:{marginBottom:'16px',border:'1.5px dashed '+C.dash,borderRadius:'12px',padding:'14px',textAlign:'center',color:C.muted,fontSize:'12.5px'}},
          '⤴ Drag a card here to move it out of this folder, into '+sec.title) : null,
      grid
    );
  }
}

if(window.React && window.ReactDOM){
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
}
</script>
</body>
</html>
